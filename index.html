                    ...roomData, members: [], createdAt: firestore.serverTimestamp()
                });
                return docRef.id;
            },

            async joinChatRoom(roomId, userId, userNickname) {
                const { firestore, db } = getFirebase();
                const roomRef = firestore.doc(db, 'chatRooms', roomId);
                const roomSnap = await firestore.getDoc(roomRef);

                if (roomSnap.exists()) {
                    const currentMembers = roomSnap.data().members || [];
                    if (!currentMembers.find(m => m.userId === userId)) {
                        await firestore.updateDoc(roomRef, {
                            members: [...currentMembers, { userId, nickname: userNickname, joinedAt: new Date() }]
                        });
                    }
                }
            },

            async getChatRooms() {
                const { firestore, db } = getFirebase();
                const q = firestore.query(firestore.collection(db, 'chatRooms'), firestore.orderBy('createdAt', 'desc'));
                const querySnapshot = await firestore.getDocs(q);

            },

            async sendMessage(roomId, userId, nickname, text) {
                const { firestore, db } = getFirebase();
                await firestore.addDoc(firestore.collection(db, `chatRooms/${roomId}/messages`), {
                    userId, nickname, text, timestamp: firestore.serverTimestamp()
                });
            },

            async getMessages(roomId) {
                const { firestore, db } = getFirebase();
                const q = firestore.query(
                    firestore.collection(db, `chatRooms/${roomId}/messages`),
                    firestore.orderBy('timestamp', 'asc'),
                    firestore.limit(50)
                );
                const querySnapshot = await firestore.getDocs(q);

            },

            async createEvent(eventData) {
                const { firestore, db } = getFirebase();
                
                // 이벤트 생성
                const docRef = await firestore.addDoc(firestore.collection(db, 'events'), {
                    ...eventData, 
                    participants: [], 
                    createdAt: firestore.serverTimestamp()
                });
                
                // 이벤트 전용 채팅방 자동 생성
                const chatRoomId = await this.createChatRoom({
                    name: `${eventData.title} 채팅방`,
                    description: `${eventData.title} 참가자들을 위한 대화방입니다.`,
                    interestId: eventData.interestId,
                    dong: 'all',
                    creatorId: eventData.creatorId,
                    creatorNickname: eventData.creatorNickname,
                    isOpen: true,
                    eventId: docRef.id, // 이벤트 ID 연결
                    isEventChat: true // 이벤트 채팅방 표시
                });
                
                // 이벤트에 채팅방 ID 저장
                await firestore.updateDoc(firestore.doc(db, 'events', docRef.id), {
                    chatRoomId: chatRoomId
                });
                
                return docRef.id;
            },

            async joinEvent(eventId, userId, userNickname) {
                const { firestore, db } = getFirebase();
                const eventRef = firestore.doc(db, 'events', eventId);
                const eventSnap = await firestore.getDoc(eventRef);
                
                if (eventSnap.exists()) {
                    const eventData = eventSnap.data();
                    const currentParticipants = eventData.participants || [];
                    const maxParticipants = eventData.maxParticipants;
                    
                    if (maxParticipants && currentParticipants.length >= maxParticipants) {
                        throw new Error('참가 인원이 마감되었습니다.');
                    }
                    
                    if (!currentParticipants.find(p => p.userId === userId)) {
                        await firestore.updateDoc(eventRef, {
                            participants: [...currentParticipants, { userId, nickname: userNickname, joinedAt: new Date() }]
                        });
                        
                        // 이벤트 채팅방에도 자동으로 참가시키기
                        if (eventData.chatRoomId) {
                            await this.joinChatRoom(eventData.chatRoomId, userId, userNickname);
                        }
                    }
                }
            },

            async leaveEvent(eventId, userId) {
                const { firestore, db } = getFirebase();
                const eventRef = firestore.doc(db, 'events', eventId);
                const eventSnap = await firestore.getDoc(eventRef);
                
                if (eventSnap.exists()) {
                    const eventData = eventSnap.data();
                    const currentParticipants = eventData.participants || [];
                    const updatedParticipants = currentParticipants.filter(p => p.userId !== userId);
                    
                    await firestore.updateDoc(eventRef, {
                        participants: updatedParticipants
                    });
                }
            },

            async getEvents() {
                const { firestore, db } = getFirebase();

            async deleteEvent(eventId) {
                const { firestore, db } = getFirebase();

                const eventRef = firestore.doc(db, 'events', eventId);
                const eventSnap = await firestore.getDoc(eventRef);
                
                if (eventSnap.exists()) {
                    const eventData = eventSnap.data();
                    
                    // 연결된 채팅방도 삭제
                    if (eventData.chatRoomId) {
                        await this.deleteChatRoom(eventData.chatRoomId);
                    }
                }
                
                // 이벤트 삭제
                await firestore.deleteDoc(eventRef);
            },

            async deleteChatRoom(roomId) {
                const { firestore, db } = getFirebase();
                
                // 채팅 메시지 먼저 삭제
                const messagesQuery = firestore.query(firestore.collection(db, `chatRooms/${roomId}/messages`));
                const messagesSnapshot = await firestore.getDocs(messagesQuery);
                
                const deletePromises = messagesSnapshot.docs.map(doc => firestore.deleteDoc(doc.ref));
                await Promise.all(deletePromises);
                
                // 채팅방 삭제
                await firestore.deleteDoc(firestore.doc(db, 'chatRooms', roomId));
            },

            async getAllUsers() {
                const { firestore, db } = getFirebase();
                const querySnapshot = await firestore.getDocs(firestore.collection(db, 'users'));
                return querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            },

            // 1:1 매칭 관련 함수
            async createMatchRequest(requestData) {
                const { firestore, db } = getFirebase();
                const docRef = await firestore.addDoc(firestore.collection(db, 'matchRequests'), {
                    ...requestData, 
                    status: 'pending',
                    createdAt: firestore.serverTimestamp()
                });
                return docRef.id;
            },

            async getMatchRequests(userId) {
                const { firestore, db } = getFirebase();
                
                const sentQuery = firestore.query(
                    firestore.collection(db, 'matchRequests'),
                    firestore.where('senderId', '==', userId),
                    firestore.orderBy('createdAt', 'desc')
                );
                
                const receivedQuery = firestore.query(
                    firestore.collection(db, 'matchRequests'),
                    firestore.where('receiverId', '==', userId),
                    firestore.orderBy('createdAt', 'desc')
                );
                
                const [sentSnapshot, receivedSnapshot] = await Promise.all([
                    firestore.getDocs(sentQuery),
                    firestore.getDocs(receivedQuery)
                ]);
                
                return {
                    sent: sentSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })),
                    received: receivedSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                };
            },

            async updateMatchRequestStatus(requestId, status) {
                const { firestore, db } = getFirebase();
                await firestore.updateDoc(firestore.doc(db, 'matchRequests', requestId), {
                    status,
                    updatedAt: firestore.serverTimestamp()
                });
            },

            async getMatchableUsers(currentUserId, filters = {}) {
                const { firestore, db } = getFirebase();

                let q = firestore.collection(db, 'users');
                const querySnapshot = await firestore.getDocs(q);

                let users = querySnapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(user => user.userId !== currentUserId);

                if (filters.interests && filters.interests.length > 0) {
                    users = users.filter(user =>
                        user.interests?.some(interest => filters.interests.includes(interest))
                    );
                }

                if (filters.age) {
                    users = users.filter(user => user.age === filters.age);
                }

                if (filters.gender) {
                    users = users.filter(user => user.gender === filters.gender);
                }

                if (filters.dong) {
                    users = users.filter(user => user.dong === filters.dong);
                }

                return users;
            },

            // 1:1 Direct Messages
            async createDirectMessageThread(user1Id, user2Id, user1Nickname, user2Nickname) {
                const { firestore, db } = getFirebase();

                // 이미 존재하는 스레드 확인
                const existingThread = await this.getDirectMessageThread(user1Id, user2Id);
                if (existingThread) return existingThread.id;

                const participants = [
                    { userId: user1Id, nickname: user1Nickname },
                    { userId: user2Id, nickname: user2Nickname }
                ];

                const docRef = await firestore.addDoc(firestore.collection(db, 'directMessages'), {
                    participants,
                    participantIds: [user1Id, user2Id],
                    lastMessage: null,
                    lastMessageAt: firestore.serverTimestamp(),
                    createdAt: firestore.serverTimestamp()
                });

                return docRef.id;
            },

            async getDirectMessageThread(user1Id, user2Id) {
                const { firestore, db } = getFirebase();

                const q = firestore.query(
                    firestore.collection(db, 'directMessages'),
                    firestore.where('participantIds', 'array-contains', user1Id)
                );

                const snapshot = await firestore.getDocs(q);
                const thread = snapshot.docs.find(doc => {
                    const data = doc.data();
                    return data.participantIds.includes(user2Id);
                });

                return thread ? { id: thread.id, ...thread.data() } : null;
            },

            async getUserDirectMessages(userId) {
                const { firestore, db } = getFirebase();

                const q = firestore.query(
                    firestore.collection(db, 'directMessages'),
                    firestore.where('participantIds', 'array-contains', userId),
                    firestore.orderBy('lastMessageAt', 'desc')
                );

                const snapshot = await firestore.getDocs(q);
                return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            },

            async sendDirectMessage(threadId, senderId, senderNickname, text) {
                const { firestore, db } = getFirebase();

                await firestore.addDoc(firestore.collection(db, `directMessages/${threadId}/messages`), {
                    senderId,
                    senderNickname,
                    text,
                    timestamp: firestore.serverTimestamp(),
                    read: false
                });

                // Update thread last message
                await firestore.updateDoc(firestore.doc(db, 'directMessages', threadId), {
                    lastMessage: text,
                    lastMessageAt: firestore.serverTimestamp()
                });
            },

            async getDirectMessages(threadId) {
                const { firestore, db } = getFirebase();

                const q = firestore.query(
                    firestore.collection(db, `directMessages/${threadId}/messages`),

            // Statistics (matchRequests 제외 - 권한 문제)
            async getStatistics() {
                const { firestore, db } = getFirebase();

                const [users, events, chatRooms] = await Promise.all([
                    this.getAllUsers(),
                    this.getEvents(),
                    this.getChatRooms()
                ]);

                // Calculate interest popularity
                const interestCount = {};
                users.forEach(user => {
                    user.interests?.forEach(interest => {
                        interestCount[interest] = (interestCount[interest] || 0) + 1;
                    });
                });

                const topInterests = Object.entries(interestCount)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 10)
                    .map(([id, count]) => ({ id, count }));

                // Calculate age distribution
                const ageDistribution = {};
                users.forEach(user => {
                    const age = user.age || 'unknown';
                    ageDistribution[age] = (ageDistribution[age] || 0) + 1;
                });

                // Top events by participants
                const topEvents = events
                    .sort((a, b) => (b.participants?.length || 0) - (a.participants?.length || 0))
                    .slice(0, 5);

                // Top chat rooms by members
                const topChatRooms = chatRooms
                    .filter(room => !room.isEventChat)
                    .sort((a, b) => (b.members?.length || 0) - (a.members?.length || 0))
                    .slice(0, 5);

                return {
                    totalUsers: users.length,
                    totalEvents: events.length,
                    totalChatRooms: chatRooms.filter(r => !r.isEventChat).length,
                    topInterests,
                    ageDistribution,
                    topEvents,
                    topChatRooms
                };
            },

            // 피드백/요청사항

            // 인기글 가져오기 (좋아요 기준)
            async getPopularPosts(limitCount = 5) {
                const { firestore, db } = getFirebase();

                // 모든 게시판에서 최근 글 가져오기
                const [posts, recommendations, sharing] = await Promise.all([
                    firestore.getDocs(firestore.query(firestore.collection(db, 'posts'), firestore.orderBy('createdAt', 'desc'), firestore.limit(20))),
                    firestore.getDocs(firestore.query(firestore.collection(db, 'recommendations'), firestore.orderBy('createdAt', 'desc'), firestore.limit(20))),
                    firestore.getDocs(firestore.query(firestore.collection(db, 'sharing'), firestore.orderBy('createdAt', 'desc'), firestore.limit(20)))
                ]);

                const allPosts = [
                    ...posts.docs.map(doc => ({ id: doc.id, ...doc.data(), type: 'posts', typeName: '모임후기' })),
                    ...recommendations.docs.map(doc => ({ id: doc.id, ...doc.data(), type: 'recommendations', typeName: '맛집추천' })),
                    ...sharing.docs.map(doc => ({ id: doc.id, ...doc.data(), type: 'sharing', typeName: '나눔' }))
                ];

                // 좋아요 수로 정렬
                return allPosts
                    .sort((a, b) => (b.likes?.length || 0) - (a.likes?.length || 0))
                    .slice(0, limitCount);
            },

            // 통합 검색
            async searchAll(query) {
                const { firestore, db } = getFirebase();
                const searchLower = query.toLowerCase();

                const [posts, recommendations, sharing, chatRooms, events] = await Promise.all([
                    firestore.getDocs(firestore.collection(db, 'posts')),
                    firestore.getDocs(firestore.collection(db, 'recommendations')),
                    firestore.getDocs(firestore.collection(db, 'sharing')),
                    firestore.getDocs(firestore.collection(db, 'chatRooms')),
                    firestore.getDocs(firestore.collection(db, 'events'))
                ]);

                const results = {
                    posts: posts.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                        .filter(p => p.title?.toLowerCase().includes(searchLower) || p.content?.toLowerCase().includes(searchLower)),
                    recommendations: recommendations.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                        .filter(p => p.title?.toLowerCase().includes(searchLower) || p.content?.toLowerCase().includes(searchLower) || p.placeName?.toLowerCase().includes(searchLower)),
                    sharing: sharing.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                        .filter(p => p.title?.toLowerCase().includes(searchLower) || p.content?.toLowerCase().includes(searchLower)),
                    chatRooms: chatRooms.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                        .filter(r => r.name?.toLowerCase().includes(searchLower) || r.description?.toLowerCase().includes(searchLower)),
                    events: events.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                        .filter(e => e.title?.toLowerCase().includes(searchLower) || e.description?.toLowerCase().includes(searchLower))
                };

                return results;
            },

            // 차단 기능
            async blockUser(userId, blockedUserId) {
                const { firestore, db } = getFirebase();
                const userDoc = await this.getUserProfile(userId);
                if (userDoc) {
                    const blockedUsers = userDoc.blockedUsers || [];
                    if (!blockedUsers.includes(blockedUserId)) {
                        blockedUsers.push(blockedUserId);
                        await firestore.updateDoc(firestore.doc(db, 'users', userDoc.id), { blockedUsers });
                    }
                }
            },

            async unblockUser(userId, blockedUserId) {
                const { firestore, db } = getFirebase();
                const userDoc = await this.getUserProfile(userId);
                if (userDoc) {
                    const blockedUsers = (userDoc.blockedUsers || []).filter(id => id !== blockedUserId);
                    await firestore.updateDoc(firestore.doc(db, 'users', userDoc.id), { blockedUsers });
                }
            },

            // 팔로우 기능
            async followUser(userId, targetUserId) {
                const { firestore, db } = getFirebase();

                // 내 following에 추가
                const userDoc = await this.getUserProfile(userId);
                if (userDoc) {
                    const following = userDoc.following || [];
                    if (!following.includes(targetUserId)) {
                        following.push(targetUserId);
                        await firestore.updateDoc(firestore.doc(db, 'users', userDoc.id), { following });
                    }
                }

                // 상대방 followers에 추가
                const targetDoc = await this.getUserProfile(targetUserId);
                if (targetDoc) {
                    const followers = targetDoc.followers || [];
                    if (!followers.includes(userId)) {
                        followers.push(userId);
                        await firestore.updateDoc(firestore.doc(db, 'users', targetDoc.id), { followers });
                    }
                }
            },

            async unfollowUser(userId, targetUserId) {
                const { firestore, db } = getFirebase();

                const userDoc = await this.getUserProfile(userId);
                if (userDoc) {
                    const following = (userDoc.following || []).filter(id => id !== targetUserId);
                    await firestore.updateDoc(firestore.doc(db, 'users', userDoc.id), { following });
                }

                const targetDoc = await this.getUserProfile(targetUserId);
                if (targetDoc) {
                    const followers = (targetDoc.followers || []).filter(id => id !== userId);
                    await firestore.updateDoc(firestore.doc(db, 'users', targetDoc.id), { followers });
                }
            },

            async getUserProfileById(targetUserId) {

            // 활동 배지 계산
            calculateBadges(userProfile, stats) {
                const badges = [];
                const postCount = stats?.postCount || 0;
                const eventCount = stats?.eventCount || 0;
                const commentCount = stats?.commentCount || 0;
                const followersCount = userProfile?.followers?.length || 0;

                if (postCount >= 10) badges.push({ id: 'writer', name: '활발한 작성자', icon: '✍️', color: 'bg-blue-100 text-blue-700' });
                if (postCount >= 50) badges.push({ id: 'prolific', name: '다작 작가', icon: '📚', color: 'bg-purple-100 text-purple-700' });
                if (eventCount >= 5) badges.push({ id: 'social', name: '소셜 나비', icon: '🦋', color: 'bg-pink-100 text-pink-700' });
                if (commentCount >= 30) badges.push({ id: 'commenter', name: '소통왕', icon: '💬', color: 'bg-green-100 text-green-700' });
                if (followersCount >= 10) badges.push({ id: 'popular', name: '인기인', icon: '⭐', color: 'bg-yellow-100 text-yellow-700' });
                if (followersCount >= 50) badges.push({ id: 'influencer', name: '인플루언서', icon: '🌟', color: 'bg-amber-100 text-amber-700' });

                return badges;
            },

            // 읽지 않은 공지사항 수 조회
            async getUnreadNoticesCount(userId, lastCheckedTime) {
                const { firestore, db } = getFirebase();
                const q = firestore.query(
                    firestore.collection(db, 'notices'),
                    firestore.orderBy('createdAt', 'desc')
                );
                const snapshot = await firestore.getDocs(q);
                if (!lastCheckedTime) return snapshot.size;

                const unreadCount = snapshot.docs.filter(doc => {
                    const createdAt = doc.data().createdAt;
                    if (!createdAt) return false;
                    return createdAt.toMillis() > lastCheckedTime;
                }).length;
                return unreadCount;
            },

            // 읽지 않은 메시지 수 조회
            async getUnreadMessagesCount(userId) {
                const { firestore, db } = getFirebase();
                const threadsQuery = firestore.query(
                    firestore.collection(db, 'directMessages'),
                    firestore.where('participantIds', 'array-contains', userId)
                );
                const threadsSnapshot = await firestore.getDocs(threadsQuery);

                let unreadCount = 0;
                for (const threadDoc of threadsSnapshot.docs) {
                    const messagesQuery = firestore.query(
                        firestore.collection(db, `directMessages/${threadDoc.id}/messages`),
                        firestore.where('read', '==', false)
                    );
                    const messagesSnapshot = await firestore.getDocs(messagesQuery);
                    // 본인이 보낸 메시지 제외
                    unreadCount += messagesSnapshot.docs.filter(msg => msg.data().senderId !== userId).length;
                }
                return unreadCount;
            },

            // 대기중인 매칭 요청 수 조회 (받은 요청 중 pending 상태)
            async getPendingMatchRequestsCount(userId) {

                const q = firestore.query(
                    firestore.collection(db, 'matchRequests'),
                    firestore.where('receiverId', '==', userId),
                    firestore.where('status', '==', 'pending')
                );
                const snapshot = await firestore.getDocs(q);
                return snapshot.size;
            },

                });

            // 메시지 읽음 처리
            async markMessagesAsRead(threadId, userId) {
                const { firestore, db } = getFirebase();
                const messagesQuery = firestore.query(
                    firestore.collection(db, `directMessages/${threadId}/messages`),
                    firestore.where('read', '==', false)
                );
                const snapshot = await firestore.getDocs(messagesQuery);

                const updatePromises = snapshot.docs
                    .filter(doc => doc.data().senderId !== userId)
                    .map(doc => firestore.updateDoc(doc.ref, { read: true }));
                await Promise.all(updatePromises);
            }
        };

                                            {results.sharing.map(post => (

                                                    <p className="font-medium text-gray-800 truncate">{post.title}</p>
                                                    <p className="text-xs text-gray-400">{post.authorNickname}</p>
                                                </button>

                                        </div>
                                    </div>

                                {results.events?.length > 0 && (
                                    <div>
                                        <h3 className="text-sm font-semibold text-gray-500 mb-2">이벤트</h3>
                                        <div className="bg-white rounded-xl border border-gray-100 divide-y">
                                            {results.events.map(event => (
                                                <button key={event.id} onClick={() => setCurrentPage('events')} className="w-full p-3 text-left hover:bg-gray-50">
                                                    <p className="font-medium text-gray-800 truncate">{event.title}</p>

                                <Search size={48} className="mx-auto mb-4 opacity-30" />
                                <p>게시글, 모임방, 이벤트를 검색해보세요</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 캘린더 페이지
        const CalendarPage = ({ user, userProfile, setCurrentPage }) => {
            const [events, setEvents] = useState([]);
            const [currentMonth, setCurrentMonth] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(null);

            useEffect(() => {
                loadEvents();
            }, []);

            const loadEvents = async () => {
                const evts = await FirebaseUtils.getEvents();
                setEvents(evts);
            };

            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const days = [];

                // 이전 달 빈 칸
                for (let i = 0; i < firstDay.getDay(); i++) {
                    days.push(null);
                }

                // 현재 달 일수
                for (let i = 1; i <= lastDay.getDate(); i++) {
                    days.push(i);
                }

                return days;
            };

            const getEventsForDate = (day) => {
                if (!day) return [];
                const dateStr = `${currentMonth.getFullYear()}-${String(currentMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                return events.filter(e => {
                    if (!e.eventDate) return false;
                    // eventDate는 "2025-01-15T10:00" 형식이므로 앞 10자리만 비교
                    const eventDateStr = e.eventDate.substring(0, 10);
                    return eventDateStr === dateStr;
                });
            };

            const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
            const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
            const days = getDaysInMonth(currentMonth);

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="px-4 py-3 flex items-center max-w-lg mx-auto">
                            <button onClick={() => setCurrentPage('dashboard')} className="mr-3 text-gray-600">
                                <ChevronRight size={24} className="rotate-180" />
                            </button>
                            <h1 className="text-lg font-bold text-gray-800">캘린더</h1>
                        </div>
                    </header>

                    <div className="px-4 py-4 max-w-lg mx-auto">
                        {/* 월 선택 */}
                        <div className="flex items-center justify-between mb-4">
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))} className="p-2 hover:bg-gray-100 rounded-lg">
                                <ChevronRight size={20} className="rotate-180 text-gray-600" />
                            </button>
                            <h2 className="text-lg font-bold text-gray-800">
                                {currentMonth.getFullYear()}년 {monthNames[currentMonth.getMonth()]}
                            </h2>
                            <button onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))} className="p-2 hover:bg-gray-100 rounded-lg">
                                <ChevronRight size={20} className="text-gray-600" />
                            </button>
                        </div>

                        {/* 캘린더 그리드 */}
                        <div className="bg-white rounded-xl border border-gray-100 p-4">
                            <div className="grid grid-cols-7 gap-1 mb-2">
                                {dayNames.map(day => (
                                    <div key={day} className={`text-center text-xs font-medium py-2 ${day === '일' ? 'text-red-500' : day === '토' ? 'text-blue-500' : 'text-gray-500'}`}>
                                        {day}
                                    </div>
                                ))}
                            </div>
                            <div className="grid grid-cols-7 gap-1">
                                {days.map((day, idx) => {
                                    const dayEvents = getEventsForDate(day);
                                    const isToday = day && new Date().getDate() === day && new Date().getMonth() === currentMonth.getMonth() && new Date().getFullYear() === currentMonth.getFullYear();
                                    return (
                                        <button
                                            key={idx}
                                            onClick={() => day && setSelectedDate({ day, events: dayEvents })}
                                            className={`aspect-square p-1 rounded-lg text-sm relative ${day ? 'hover:bg-gray-100' : ''} ${isToday ? 'bg-blue-100 text-blue-700 font-bold' : ''}`}
                                            disabled={!day}
                                        >
                                            {day}
                                            {dayEvents.length > 0 && (
                                                <span className="absolute bottom-1 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-pink-500 rounded-full"></span>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 선택된 날짜의 이벤트 */}
                        {selectedDate && (
                            <div className="mt-4 bg-white rounded-xl border border-gray-100 p-4">
                                <h3 className="font-semibold text-gray-800 mb-3">{currentMonth.getMonth() + 1}월 {selectedDate.day}일 일정</h3>
                                {selectedDate.events.length === 0 ? (
                                    <p className="text-gray-400 text-sm">예정된 일정이 없습니다</p>
                                ) : (
                                    <div className="space-y-2">
                                        {selectedDate.events.map(event => {
                                            const eventTime = event.eventDate ? new Date(event.eventDate).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '시간 미정';
                                            return (
                                                <div key={event.id} className="p-3 bg-pink-50 rounded-lg border border-pink-100">
                                                    <p className="font-medium text-gray-800">{event.title}</p>
                                                    <p className="text-xs text-gray-500">{eventTime} · {event.location}</p>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 나눔 · 중고거래 페이지 (확장)
        const TradingPage = ({ user, userProfile, setCurrentPage }) => {
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [filterCategory, setFilterCategory] = useState('all');
            const [filterType, setFilterType] = useState('all'); // all, free, sale
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, itemId: null });

            const categories = {
                free: '무료나눔',
                exchange: '교환',
                need: '필요해요',
                sale: '판매'
            };

            useEffect(() => {
                loadItems();
            }, []);

            const loadItems = async () => {
                setLoading(true);
                try {
                    const data = await FirebaseUtils.getSharing();
                    setItems(data);
                } catch (error) {
                    console.error('로드 실패:', error);
                } finally {
                    setLoading(false);
                }
            };

            const filteredItems = items.filter(item => {
                if (filterCategory !== 'all' && item.category !== filterCategory) return false;
                if (filterType === 'free' && item.category === 'sale') return false;
                if (filterType === 'sale' && item.category !== 'sale') return false;
                return true;
            });

            const handleCreate = async (data) => {
                try {
                    await FirebaseUtils.createSharing({
                        ...data,
                        authorId: user.uid,
                        authorNickname: userProfile?.nickname || '익명',
                        status: 'active'
                    });
                    setShowCreateModal(false);
                    setToast({ message: '등록되었습니다.', type: 'success' });
                    loadItems();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleEdit = (item) => {
                setEditingItem(item);
                setShowEditModal(true);
            };

            const handleDelete = (itemId) => {
                setConfirmModal({ isOpen: true, itemId });
            };

            const confirmDelete = async () => {
                const itemId = confirmModal.itemId;
                setConfirmModal({ isOpen: false, itemId: null });
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.deleteDoc(firestore.doc(db, 'trading', itemId));
                    setToast({ message: '삭제되었습니다.', type: 'success' });
                    loadItems();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleUpdate = async (data) => {
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.updateDoc(firestore.doc(db, 'trading', editingItem.id), {
                        ...data,
                        updatedAt: firestore.serverTimestamp()
                    });
                    setShowEditModal(false);
                    setEditingItem(null);
                    setToast({ message: '수정되었습니다.', type: 'success' });
                    loadItems();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {/* 확인 모달 */}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title="글 삭제"
                        message="정말 삭제하시겠습니까?"
                        onConfirm={confirmDelete}
                        onCancel={() => setConfirmModal({ isOpen: false, itemId: null })}
                        confirmText="삭제"
                        danger={true}
                    />

                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="px-4 py-3 flex items-center justify-between max-w-lg mx-auto">
                            <div className="flex items-center">
                                <button onClick={() => setCurrentPage('dashboard')} className="mr-3 text-gray-600">
                                    <ChevronRight size={24} className="rotate-180" />
                                </button>
                                <h1 className="text-lg font-bold text-gray-800">나눔 · 중고거래</h1>
                            </div>
                            <button onClick={() => setShowCreateModal(true)} className="w-9 h-9 bg-slate-700 rounded-full flex items-center justify-center text-white">
                                <Plus size={20} />
                            </button>
                        </div>
                    </header>

                    {/* 필터 */}
                    <div className="px-4 py-3 bg-white border-b max-w-lg mx-auto flex gap-2 overflow-x-auto">
                        <button onClick={() => setFilterType('all')} className={`px-3 py-1.5 rounded-full text-sm whitespace-nowrap ${filterType === 'all' ? 'bg-slate-700 text-white' : 'bg-gray-100 text-gray-600'}`}>전체</button>
                        <button onClick={() => setFilterType('free')} className={`px-3 py-1.5 rounded-full text-sm whitespace-nowrap ${filterType === 'free' ? 'bg-slate-700 text-white' : 'bg-gray-100 text-gray-600'}`}>나눔</button>
                        <button onClick={() => setFilterType('sale')} className={`px-3 py-1.5 rounded-full text-sm whitespace-nowrap ${filterType === 'sale' ? 'bg-slate-700 text-white' : 'bg-gray-100 text-gray-600'}`}>판매</button>
                    </div>

                    <div className="px-4 py-4 max-w-lg mx-auto">
                        {loading ? (
                            <div className="text-center py-12"><div className="loading border-slate-600"></div></div>
                        ) : filteredItems.length === 0 ? (
                            <div className="text-center py-12 text-gray-400">등록된 글이 없습니다</div>
                        ) : (
                            <div className="space-y-3">
                                {filteredItems.map(item => (
                                    <div key={item.id} className={`bg-white rounded-xl border p-4 ${item.status === 'completed' ? 'opacity-50' : 'border-gray-100'}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="flex gap-2">
                                                <span className={`px-2 py-0.5 rounded text-xs font-medium ${item.category === 'sale' ? 'bg-pink-100 text-pink-700' : 'bg-green-100 text-green-700'}`}>
                                                    {categories[item.category]}
                                                </span>
                                                {item.status === 'completed' && <span className="px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500">완료</span>}
                                            </div>
                                            <div className="flex items-center gap-2">
                                                {item.price && <span className="font-bold text-pink-600">{Number(item.price).toLocaleString()}원</span>}
                                                {item.authorId === user.uid && (
                                                    <div className="flex items-center gap-1 ml-2">
                                                        <button onClick={() => handleEdit(item)} className="text-blue-500 hover:text-blue-700 p-1">
                                                            <Edit size={16} />
                                                        </button>
                                                        <button onClick={() => handleDelete(item.id)} className="text-red-500 hover:text-red-700 p-1">
                                                            <Trash size={16} />
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <h3 className="font-semibold text-gray-800 mb-1">{item.title}</h3>
                                        <p className="text-sm text-gray-500 line-clamp-2 mb-2">{item.content}</p>
                                        <div className="flex items-center justify-between text-xs text-gray-400">
                                            <span>{item.authorNickname}</span>
                                            <span>❤️ {item.likes?.length || 0}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 글쓰기 모달 */}
                    {showCreateModal && (
                        <TradingCreateModal onClose={() => setShowCreateModal(false)} onCreate={handleCreate} />
                    )}

                    {/* 수정 모달 */}
                    {showEditModal && editingItem && (
                        <TradingEditModal item={editingItem} onClose={() => { setShowEditModal(false); setEditingItem(null); }} onUpdate={handleUpdate} />
                    )}
                </div>
            );
        };

        // 중고거래 수정 모달
        const TradingEditModal = ({ item, onClose, onUpdate }) => {
            const [category, setCategory] = useState(item.category || 'free');
            const [title, setTitle] = useState(item.title || '');
            const [content, setContent] = useState(item.content || '');
            const [price, setPrice] = useState(item.price || '');
            const [status, setStatus] = useState(item.status || 'active');
            const [toast, setToast] = useState(null);

            const categories = [
                { id: 'free', name: '무료나눔', icon: '🎁' },
                { id: 'exchange', name: '교환', icon: '🔄' },
                { id: 'need', name: '필요해요', icon: '🙋' },
                { id: 'sale', name: '판매', icon: '💰' }
            ];

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim() || !content.trim()) {
                    setToast({ message: '제목과 내용을 입력해주세요.', type: 'error' });
                    return;
                }
                onUpdate({ category, title: title.trim(), content: content.trim(), price: category === 'sale' ? price : null, status });
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center" style={{zIndex: 60}} onClick={onClose}>
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <div className="bg-white w-full max-w-lg rounded-t-2xl p-5 pb-10 max-h-[85vh] overflow-y-auto animate-slide-up" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-lg">글 수정</h3>
                            <button onClick={onClose} className="text-gray-400"><X size={24} /></button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-2 gap-2">
                                {categories.map(cat => (
                                    <button key={cat.id} type="button" onClick={() => setCategory(cat.id)}
                                        className={`p-3 rounded-xl border text-left ${category === cat.id ? 'border-blue-500 bg-blue-50' : 'border-gray-200'}`}>
                                        <span className="text-lg mr-2">{cat.icon}</span>
                                        <span className="text-sm font-medium">{cat.name}</span>
                                    </button>
                                ))}
                            </div>

                            <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="제목" className="w-full px-4 py-3 border border-gray-200 rounded-xl" />

                            <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="내용을 입력하세요" className="w-full px-4 py-3 border border-gray-200 rounded-xl resize-none" rows={4} />

                            {category === 'sale' && (
                                <div className="relative">
                                    <input type="number" value={price} onChange={e => setPrice(e.target.value)} placeholder="가격" className="w-full px-4 py-3 border border-gray-200 rounded-xl pr-12" />
                                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">원</span>
                                </div>
                            )}

                            <div className="flex gap-2">
                                <button type="button" onClick={() => setStatus('active')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${status === 'active' ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-600'}`}>거래중</button>
                                <button type="button" onClick={() => setStatus('completed')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${status === 'completed' ? 'bg-gray-500 text-white' : 'bg-gray-100 text-gray-600'}`}>거래완료</button>
                            </div>

                            <button type="submit" className="w-full py-3 bg-slate-700 text-white rounded-xl font-medium">수정 완료</button>
                        </form>
                    </div>
                </div>
            );
        };

        // 중고거래 글쓰기 모달
        const TradingCreateModal = ({ onClose, onCreate }) => {
            const [category, setCategory] = useState('free');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [price, setPrice] = useState('');
            const [toast, setToast] = useState(null);

            const categories = [
                { id: 'free', name: '무료나눔', icon: '🎁' },
                { id: 'exchange', name: '교환', icon: '🔄' },
                { id: 'need', name: '필요해요', icon: '🙋' },
                { id: 'sale', name: '판매', icon: '💰' }
            ];

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim() || !content.trim()) {
                    setToast({ message: '제목과 내용을 입력해주세요.', type: 'error' });

                if (window.firebaseReady) {

            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [nickname, setNickname] = useState('');
            const [kakaoId, setKakaoId] = useState('');
            const [dong, setDong] = useState('');
            const [age, setAge] = useState('');
            const [gender, setGender] = useState('');
            const [selectedInterests, setSelectedInterests] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            
            const [agreedToTerms, setAgreedToTerms] = useState(false);
            const [agreedToPrivacy, setAgreedToPrivacy] = useState(false);
            const [agreedToMarketing, setAgreedToMarketing] = useState(false);
            const [showPrivacyModal, setShowPrivacyModal] = useState(false);

            const toggleInterest = (interestId) => {
                setSelectedInterests(prev =>
                    prev.includes(interestId) ? prev.filter(id => id !== interestId) : [...prev, interestId]
                );
            };

            // 로그인 처리 (관리자/일반 사용자 모두 Firebase Auth로 통합)
            const handleAdminLogin = async () => {
                await handleAuth();
            };

            const handleAuth = async () => {
                setError('');

                if (isLogin) {
                    if (!email || !password) {
                        setError('이메일과 비밀번호를 입력해주세요');
                        return;
                    }
                } else {
                    if (!nickname || !kakaoId || !dong || !age || !gender || selectedInterests.length === 0) {
                        setError('모든 필수 항목을 입력해주세요');
                        return;
                    }
                    
                    if (!agreedToTerms || !agreedToPrivacy) {
                        setError('필수 약관에 동의해주세요');
                        return;
                    }
                }

                setLoading(true);
                try {
                    const { auth } = window.firebaseModules;
                    const { auth: firebaseAuth } = window.firebaseApp;

                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(firebaseAuth, email, password);
                    } else {
                        const userCredential = await auth.createUserWithEmailAndPassword(firebaseAuth, email, password);
                        await FirebaseUtils.createUserProfile(userCredential.user.uid, {
                            nickname, 
                            kakaoId, 
                            dong, 
                            age, 
                            gender, 
                            interests: selectedInterests,
                            agreedToTerms,
                            agreedToPrivacy,
                            agreedToMarketing,
                            agreedAt: new Date().toISOString()
                        });
                    }
                } catch (err) {
                    // 에러 메시지 한글화
                    let errorMsg = err.message;
                    if (err.code === 'auth/user-not-found') {
                        errorMsg = '등록되지 않은 이메일입니다.';
                    } else if (err.code === 'auth/wrong-password') {
                        errorMsg = '비밀번호가 틀렸습니다.';
                    } else if (err.code === 'auth/invalid-email') {
                        errorMsg = '유효하지 않은 이메일 형식입니다.';
                    } else if (err.code === 'auth/email-already-in-use') {
                        errorMsg = '이미 사용 중인 이메일입니다.';
                    } else if (err.code === 'auth/weak-password') {
                        errorMsg = '비밀번호가 너무 약합니다. (6자 이상)';
                    } else if (err.code === 'auth/operation-not-allowed') {
                        errorMsg = 'Firebase 콘솔에서 이메일/비밀번호 인증을 활성화해주세요.';
                    } else if (err.code === 'auth/invalid-credential') {
                        errorMsg = '이메일 또는 비밀번호가 올바르지 않습니다.';
                    }
                    setError(errorMsg);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 py-12 px-4">
                    <div className="max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-200 p-8">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-14 h-14 bg-slate-700 rounded-xl mb-4">
                                <Users size={28} className="text-white" />
                            </div>
                            <h1 className="text-2xl font-bold text-gray-800 mb-1">평택고덕행복주택</h1>
                            <p className="text-gray-500 text-sm">이웃과 함께하는 취미 모임</p>
                        </div>

                        <div className="flex gap-1 mb-6 bg-gray-100 rounded-lg p-1">
                            <button onClick={() => setIsLogin(false)} className={`flex-1 py-2 rounded-md text-sm font-medium ${!isLogin ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500'}`}>
                                회원가입
                            </button>
                            <button onClick={() => setIsLogin(true)} className={`flex-1 py-2 rounded-md text-sm font-medium ${isLogin ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500'}`}>
                                로그인
                            </button>
                        </div>

                        {error && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{error}</div>}

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">이메일</label>
                                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-3 border rounded-lg" placeholder="email@example.com" />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 border rounded-lg" placeholder="비밀번호 (6자 이상)" />
                            </div>

                            {!isLogin && (
                                <>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">닉네임</label>
                                        <input type="text" value={nickname} onChange={(e) => setNickname(e.target.value)} className="w-full px-4 py-3 border rounded-lg" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">카카오톡 ID</label>
                                        <input type="text" value={kakaoId} onChange={(e) => setKakaoId(e.target.value)} className="w-full px-4 py-3 border rounded-lg" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">동 선택</label>
                                        <select value={dong} onChange={(e) => setDong(e.target.value)} className="w-full px-4 py-3 border rounded-lg">
                                            <option value="">선택하세요</option>
                                            <option value="6201">6201동</option>
                                            <option value="6202">6202동</option>
                                            <option value="6203">6203동</option>
                                            <option value="6204">6204동</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">연령대</label>
                                        <select value={age} onChange={(e) => setAge(e.target.value)} className="w-full px-4 py-3 border rounded-lg">
                                            <option value="">선택하세요</option>
                                            <option value="20s">20대</option>
                                            <option value="30s">30대</option>
                                            <option value="40s">40대</option>
                                            <option value="50s">50대 이상</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">성별</label>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button type="button" onClick={() => setGender('male')} className={`px-4 py-3 rounded-lg border-2 text-sm ${gender === 'male' ? 'border-slate-500 bg-slate-50 font-medium' : 'border-gray-200 text-gray-600'}`}>
                                                남성
                                            </button>
                                            <button type="button" onClick={() => setGender('female')} className={`px-4 py-3 rounded-lg border-2 text-sm ${gender === 'female' ? 'border-slate-500 bg-slate-50 font-medium' : 'border-gray-200 text-gray-600'}`}>
                                                여성
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-3">관심사 선택</label>
                                        <div className="space-y-4 max-h-96 overflow-y-auto border rounded-lg p-4">
                                            {Object.entries(interestCategories).map(([category, items]) => (
                                                <div key={category}>
                                                    <h3 className="text-sm font-semibold text-gray-700 mb-2">{category}</h3>
                                                    <div className="grid grid-cols-3 gap-2">
                                                        {items.map(interest => {
                                                            const isSelected = selectedInterests.includes(interest.id);
                                                            return (
                                                                <button key={interest.id} type="button" onClick={() => toggleInterest(interest.id)}
                                                                    className={`px-3 py-2 rounded-lg text-xs font-medium transition-all ${isSelected ? `${interest.color} ring-2 ring-slate-400` : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>
                                                                    {interest.name}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="border-t pt-4">
                                        <h3 className="text-sm font-semibold text-gray-800 mb-3">약관 동의</h3>
                                        <div className="space-y-3">
                                            <label className="flex items-start gap-2 cursor-pointer">
                                                <input 
                                                    type="checkbox" 
                                                    checked={agreedToTerms}
                                                    onChange={(e) => setAgreedToTerms(e.target.checked)}
                                                    className="mt-1 w-4 h-4 text-indigo-600 rounded focus:ring-2 focus:ring-indigo-500" 
                                                />
                                                <span className="text-sm text-gray-700">
                                                    <span className="text-red-500 font-bold">(필수)</span> 서비스 이용약관에 동의합니다
                                                </span>
                                            </label>
                                            
                                            <label className="flex items-start gap-2 cursor-pointer">
                                                <input 
                                                    type="checkbox" 
                                                    checked={agreedToPrivacy}
                                                    onChange={(e) => setAgreedToPrivacy(e.target.checked)}
                                                    className="mt-1 w-4 h-4 text-indigo-600 rounded focus:ring-2 focus:ring-indigo-500" 
                                                />
                                                <span className="text-sm text-gray-700">
                                                    <span className="text-red-500 font-bold">(필수)</span> 개인정보 수집 및 이용에 동의합니다
                                                    <button 
                                                        type="button"
                                                        onClick={() => setShowPrivacyModal(true)}
                                                        className="ml-2 text-indigo-600 underline text-xs"
                                                    >
                                                        자세히 보기
                                                    </button>
                                                </span>
                                            </label>
                                            
                                            <label className="flex items-start gap-2 cursor-pointer">
                                                <input 
                                                    type="checkbox" 
                                                    checked={agreedToMarketing}
                                                    onChange={(e) => setAgreedToMarketing(e.target.checked)}
                                                    className="mt-1 w-4 h-4 text-indigo-600 rounded focus:ring-2 focus:ring-indigo-500" 
                                                />
                                                <span className="text-sm text-gray-600">
                                                    (선택) 마케팅 정보 수신에 동의합니다
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                </>
                            )}

                            <button onClick={handleAdminLogin} disabled={loading} className="w-full bg-slate-700 text-white py-3 rounded-lg font-medium hover:bg-slate-800 flex items-center justify-center">
                                {loading ? <div className="loading"></div> : isLogin ? '로그인' : '시작하기'}
                            </button>

                        </div>
                    </div>

                    {showPrivacyModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[60]">
                            <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-xl font-bold">개인정보 처리방침</h2>
                                    <button onClick={() => setShowPrivacyModal(false)} className="text-gray-500 hover:text-gray-700">
                                        <X size={24} />
                                    </button>
                                </div>
                                
                                <div className="space-y-4 text-sm text-gray-700">
                                    <section>
                                        <h3 className="font-semibold text-base mb-2">1. 수집하는 개인정보 항목</h3>
                                        <p>이 서비스는 다음과 같은 개인정보를 수집합니다:</p>
                                        <ul className="list-disc pl-5 mt-2 space-y-1">
                                            <li>필수항목: 이메일, 닉네임, 카카오톡 ID, 동 정보, 연령대, 성별, 관심사</li>
                                            <li>자동 수집: 서비스 이용 기록, 접속 로그, 쿠키</li>
                                        </ul>
                                    </section>
                                    
                                    <section>
                                        <h3 className="font-semibold text-base mb-2">2. 개인정보의 수집 및 이용 목적</h3>
                                        <ul className="list-disc pl-5 space-y-1">
                                            <li>회원 관리 및 본인 확인</li>
                                            <li>관심사 기반 이웃 매칭 서비스 제공</li>
                                            <li>모임 및 이벤트 정보 제공</li>
                                            <li>서비스 개선 및 통계 분석</li>
                                        </ul>
                                    </section>
                                    
                                    <section>
                                        <h3 className="font-semibold text-base mb-2">3. 개인정보의 보유 및 이용기간</h3>
                                        <p>회원 탈퇴 시까지 보유하며, 탈퇴 후 즉시 파기합니다. 단, 관계 법령에 따라 일정 기간 보관이 필요한 경우 해당 기간 동안 보관합니다.</p>
                                    </section>
                                    
                                    <section>
                                        <h3 className="font-semibold text-base mb-2">4. 개인정보의 제3자 제공</h3>
                                        <p>회사는 원칙적으로 이용자의 개인정보를 제3자에게 제공하지 않습니다. 다만, 법령에 따라 요구되는 경우는 예외로 합니다.</p>
                                    </section>
                                    
                                    <section>
                                        <h3 className="font-semibold text-base mb-2">5. 이용자의 권리</h3>
                                        <p>이용자는 언제든지 자신의 개인정보를 조회하거나 수정할 수 있으며, 가입 해지를 요청할 수 있습니다.</p>
                                    </section>
                                </div>
                                
                                <button
                                    onClick={() => setShowPrivacyModal(false)}
                                    className="w-full mt-6 bg-slate-700 text-white py-3 rounded-lg font-medium hover:bg-slate-800"
                                >
                                    확인
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 관리자 페이지 (기능 확장)
        const AdminPage = ({ setCurrentPage }) => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [users, setUsers] = useState([]);
            const [chatRooms, setChatRooms] = useState([]);
            const [events, setEvents] = useState([]);
            const [notices, setNotices] = useState([]);
            const [posts, setPosts] = useState([]);
            const [matchRequests, setMatchRequests] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showNoticeModal, setShowNoticeModal] = useState(false);
            const [stats, setStats] = useState(null);

            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                setLoading(true);
                try {
                    const { firestore } = window.firebaseModules;
                    const { db } = window.firebaseApp;

                    const [usersData, chatRoomsData, eventsData, noticesData, postsData, matchData, statsData] = await Promise.all([
                        FirebaseUtils.getAllUsers(),
                        FirebaseUtils.getChatRooms(),
                        FirebaseUtils.getEvents(),
                        firestore.getDocs(firestore.query(firestore.collection(db, 'notices'), firestore.orderBy('createdAt', 'desc'))),
                        firestore.getDocs(firestore.query(firestore.collection(db, 'posts'), firestore.orderBy('createdAt', 'desc'))),
                        firestore.getDocs(firestore.collection(db, 'matchRequests')),
                        FirebaseUtils.getStatistics()
                    ]);

                    setUsers(usersData);
                    setChatRooms(chatRoomsData);
                    setEvents(eventsData);
                    setNotices(noticesData.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setPosts(postsData.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setMatchRequests(matchData.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setStats(statsData);
                } catch (error) {
                    console.error('데이터 로드 실패:', error);
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteEvent = async (eventId) => {
                if (!confirm('이벤트를 삭제하시겠습니까?')) return;
                try {
                    await FirebaseUtils.deleteEvent(eventId);
                    alert('삭제되었습니다.');
                    loadData();
                } catch (error) {
                    alert('삭제 실패: ' + error.message);
                }
            };

            const handleDeleteChatRoom = async (roomId) => {
                if (!confirm('채팅방을 삭제하시겠습니까?')) return;
                try {
                    await FirebaseUtils.deleteChatRoom(roomId);
                    alert('삭제되었습니다.');
                    loadData();
                } catch (error) {
                    alert('삭제 실패: ' + error.message);
                }
            };

            const handleDeleteNotice = async (noticeId) => {
                if (!confirm('공지사항을 삭제하시겠습니까?')) return;
                try {
                    const { firestore } = window.firebaseModules;
                    const { db } = window.firebaseApp;
                    await firestore.deleteDoc(firestore.doc(db, 'notices', noticeId));
                    alert('삭제되었습니다.');
                    loadData();
                } catch (error) {
                    alert('삭제 실패: ' + error.message);
                }
            };

            const handleDeletePost = async (postId) => {
                if (!confirm('게시글을 삭제하시겠습니까?')) return;
                try {
                    const { firestore } = window.firebaseModules;
                    const { db } = window.firebaseApp;
                    await firestore.deleteDoc(firestore.doc(db, 'posts', postId));
                    alert('삭제되었습니다.');
                    loadData();
                } catch (error) {
                    alert('삭제 실패: ' + error.message);
                }
            };

            const handleLogout = async () => {
                const { auth } = window.firebaseModules;
                await auth.signOut(window.firebaseApp.auth);
            };

            // 공지사항 작성 모달
            const NoticeModal = () => {
                const [title, setTitle] = useState('');
                const [content, setContent] = useState('');
                const [type, setType] = useState('normal');
                const [submitting, setSubmitting] = useState(false);

                const handleSubmit = async () => {
                    if (!title || !content) {
                        alert('제목과 내용을 입력해주세요');
                        return;
                    }
                    setSubmitting(true);
                    try {
                        const { firestore } = window.firebaseModules;
                        const { db } = window.firebaseApp;
                        await firestore.addDoc(firestore.collection(db, 'notices'), {
                            title,
                            content,
                            type,
                            createdAt: firestore.serverTimestamp(),
                            authorId: 'admin',
                            authorName: '관리자'
                        });
                        alert('공지사항이 등록되었습니다.');
                        setShowNoticeModal(false);
                        loadData();
                    } catch (error) {
                        alert('등록 실패: ' + error.message);
                    } finally {
                        setSubmitting(false);
                    }
                };

                return (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[60]">
                        <div className="bg-white rounded-xl max-w-lg w-full p-6">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-lg font-bold">공지사항 작성</h2>
                                <button onClick={() => setShowNoticeModal(false)} className="text-gray-500 hover:text-gray-700">
                                    <X size={24} />
                                </button>
                            </div>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium mb-2">공지 유형</label>
                                    <div className="flex gap-3">
                                        <button
                                            type="button"
                                            onClick={() => setType('normal')}
                                            className={`px-4 py-2 rounded-lg text-sm ${type === 'normal' ? 'bg-blue-100 text-blue-700 font-medium' : 'bg-gray-100 text-gray-600'}`}
                                        >
                                            일반 공지
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setType('urgent')}
                                            className={`px-4 py-2 rounded-lg text-sm ${type === 'urgent' ? 'bg-red-100 text-red-700 font-medium' : 'bg-gray-100 text-gray-600'}`}
                                        >
                                            긴급 공지
                                        </button>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">제목</label>
                                    <input
                                        type="text"
                                        value={title}
                                        onChange={(e) => setTitle(e.target.value)}
                                        className="w-full px-4 py-2 border rounded-lg"
                                        placeholder="공지사항 제목"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">내용</label>
                                    <textarea
                                        value={content}
                                        onChange={(e) => setContent(e.target.value)}
                                        className="w-full px-4 py-2 border rounded-lg h-40"
                                        placeholder="공지사항 내용을 입력하세요"
                                    />
                                </div>
                                <button
                                    onClick={handleSubmit}
                                    disabled={submitting}
                                    className="w-full bg-slate-700 text-white py-3 rounded-lg font-medium hover:bg-slate-800"
                                >
                                    {submitting ? '등록 중...' : '공지사항 등록'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const pendingMatches = matchRequests.filter(m => m.status === 'pending').length;
            const acceptedMatches = matchRequests.filter(m => m.status === 'accepted').length;

            return (
                <div className="min-h-screen bg-gray-100">
