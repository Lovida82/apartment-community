            const [activeTab, setActiveTab] = useState('discover');
            const [matchableUsers, setMatchableUsers] = useState([]);
            const [sentRequests, setSentRequests] = useState([]);
            const [receivedRequests, setReceivedRequests] = useState([]);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, request: null });
            const [filters, setFilters] = useState({
                interests: [],
                age: '',
                gender: '',
                dong: ''
            });

            useEffect(() => {
                loadData();
            }, [filters]);

            const loadData = async () => {
                setLoading(true);
                try {
                    const [users, requests] = await Promise.all([
                        FirebaseUtils.getMatchableUsers(user.uid, filters),
                        FirebaseUtils.getMatchRequests(user.uid)
                    ]);

                    setMatchableUsers(users);
                    setSentRequests(requests.sent);
                    setReceivedRequests(requests.received);
                } catch (error) {
                    console.error('데이터 로드 실패:', error);
                } finally {
                    setLoading(false);
                }
            };

            const handleSendRequest = async (targetUser) => {
                try {
                    await FirebaseUtils.createMatchRequest({
                        senderId: user.uid,
                        senderNickname: userProfile?.nickname,
                        receiverId: targetUser.userId,
                        receiverNickname: targetUser.nickname,
                        message: `안녕하세요! ${userProfile?.nickname}입니다. 같은 관심사를 가진 이웃으로 인사드리고 싶어 연락드려요 😊`
                    });

                    // Create notification for receiver
                    await FirebaseUtils.createNotification(
                        targetUser.userId,
                        'match_request',
                        '새로운 매칭 요청',
                        `${userProfile?.nickname}님이 매칭을 요청했습니다.`
                    );

                    setToast({ message: '매칭 요청을 보냈습니다!', type: 'success' });
                    loadData();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleAcceptRequest = async (request) => {
                try {
                    await FirebaseUtils.updateMatchRequestStatus(request.id, 'accepted');

                    // Create DM thread
                    const threadId = await FirebaseUtils.createDirectMessageThread(
                        user.uid,
                        request.senderId,
                        userProfile?.nickname,
                        request.senderNickname
                    );

                    // Create notification for sender
                    await FirebaseUtils.createNotification(
                        request.senderId,
                        'match_accepted',
                        '매칭 수락됨',
                        `${userProfile?.nickname}님이 매칭을 수락했습니다! 메시지를 보내보세요.`
                    );

                    // Ask if user wants to go to messages
                    setConfirmModal({ isOpen: true, request });
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleConfirmGoToMessages = () => {
                setConfirmModal({ isOpen: false, request: null });
                setCurrentPage('directMessages');
            };

            const handleCancelGoToMessages = () => {
                setConfirmModal({ isOpen: false, request: null });
                loadData();
            };

            const handleSendMessage = async (request) => {
                try {
                    // Create or get DM thread
                    const threadId = await FirebaseUtils.createDirectMessageThread(
                        user.uid,
                        request.senderId || request.receiverId,
                        userProfile?.nickname,
                        request.senderNickname || request.receiverNickname
                    );

                    setCurrentPage('directMessages');
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleRejectRequest = async (requestId) => {
                try {
                    await FirebaseUtils.updateMatchRequestStatus(requestId, 'rejected');
                    setToast({ message: '매칭을 거절했습니다.', type: 'info' });
                    loadData();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title="매칭 수락 완료"
                        message="1:1 메시지로 이동하시겠습니까?"
                        onConfirm={handleConfirmGoToMessages}
                        onCancel={handleCancelGoToMessages}
                        confirmText="이동"
                        cancelText="나중에"
                    />
                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-bold text-gray-800">1:1 이웃 매칭</h1>
                                <button onClick={() => setCurrentPage('dashboard')} className="text-gray-600 hover:text-gray-800">← 돌아가기</button>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-8">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex gap-1 mb-6 bg-gray-100 rounded-lg p-1">
                                <button
                                    onClick={() => setActiveTab('discover')}
                                    className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'discover' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    이웃 찾기
                                </button>
                                <button
                                    onClick={() => setActiveTab('sent')}
                                    className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'sent' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    보낸 요청 ({sentRequests.length})
                                </button>
                                <button
                                    onClick={() => setActiveTab('received')}
                                    className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'received' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    받은 요청 ({receivedRequests.filter(r => r.status === 'pending').length})
                                </button>
                            </div>

                            {activeTab === 'discover' && (
                                <div>
                                    <div className="bg-white rounded-xl p-4 mb-4 shadow-sm">
                                        <h3 className="font-semibold mb-3 text-gray-800">필터</h3>
                                        <div className="grid grid-cols-2 gap-3">
                                            <select 
                                                value={filters.age}
                                                onChange={(e) => setFilters({...filters, age: e.target.value})}
                                                className="px-3 py-2 border rounded-lg text-sm"
                                            >
                                                <option value="">모든 연령대</option>
                                                <option value="20s">20대</option>
                                                <option value="30s">30대</option>
                                                <option value="40s">40대</option>
                                                <option value="50s">50대 이상</option>
                                            </select>
                                            
                                            <select 
                                                value={filters.gender}
                                                onChange={(e) => setFilters({...filters, gender: e.target.value})}
                                                className="px-3 py-2 border rounded-lg text-sm"
                                            >
                                                <option value="">모든 성별</option>
                                                <option value="male">남성</option>
                                                <option value="female">여성</option>
                                            </select>
                                            
                                            <select 
                                                value={filters.dong}
                                                onChange={(e) => setFilters({...filters, dong: e.target.value})}
                                                className="px-3 py-2 border rounded-lg text-sm"
                                            >
                                                <option value="">모든 동</option>
                                                <option value="6201">6201동</option>
                                                <option value="6202">6202동</option>
                                                <option value="6203">6203동</option>
                                                <option value="6204">6204동</option>
                                            </select>
                                        </div>
                                    </div>

                                    {loading ? (
                                        <div className="text-center py-12">
                                            <div className="loading"></div>
                                            <p className="mt-4 text-gray-600">로딩 중...</p>
                                        </div>
                                    ) : matchableUsers.length === 0 ? (
                                        <div className="bg-white rounded-xl p-12 text-center">
                                            <Heart size={48} className="mx-auto mb-4 text-gray-400" />
                                            <h3 className="text-xl font-bold text-gray-800 mb-2">매칭 가능한 이웃이 없습니다</h3>
                                            <p className="text-gray-600">필터를 조정해보세요</p>
                                        </div>
                                    ) : (
                                        <div className="grid gap-4">
                                            {matchableUsers.map(matchUser => {
                                                const alreadySent = sentRequests.some(r => r.receiverId === matchUser.userId && r.status === 'pending');
                                                const commonInterests = userProfile?.interests?.filter(i => matchUser.interests?.includes(i)) || [];
                                                
                                                return (
                                                    <div key={matchUser.id} className="bg-white rounded-lg p-5 shadow-sm border border-gray-100">
                                                        <div className="flex items-start justify-between">
                                                            <div className="flex items-start gap-4 flex-1">
                                                                <div className="w-12 h-12 bg-slate-500 rounded-full flex items-center justify-center text-white text-lg font-medium">
                                                                    {matchUser.nickname?.[0] || '?'}
                                                                </div>
                                                                <div className="flex-1">
                                                                    <h3 className="text-lg font-bold text-gray-800 mb-1">{matchUser.nickname}</h3>
                                                                    <p className="text-sm text-gray-500 mb-2">
                                                                        {matchUser.gender === 'male' ? '👨' : '👩'} ·
                                                                        {matchUser.age === '20s' ? ' 20대' : matchUser.age === '30s' ? ' 30대' : matchUser.age === '40s' ? ' 40대' : ' 50대 이상'} ·
                                                                        {matchUser.dong}동
                                                                    </p>
                                                                    
                                                                    {commonInterests.length > 0 && (
                                                                        <div>
                                                                            <p className="text-xs text-gray-500 mb-1">공통 관심사 ({commonInterests.length}개)</p>
                                                                            <div className="flex flex-wrap gap-1">
                                                                                {commonInterests.map(interestId => {
                                                                                    const interest = interests.find(i => i.id === interestId);
                                                                                    if (!interest) return null;
                                                                                    return (
                                                                                        <span key={interestId} className={`px-2 py-1 rounded-full text-xs font-medium ${interest.color}`}>
                                                                                            {interest.name}
                                                                                        </span>
                                                                                    );
                                                                                })}
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            
                                                            <button
                                                                onClick={() => handleSendRequest(matchUser)}
                                                                disabled={alreadySent}
                                                                className={`px-4 py-2 rounded-lg text-sm ${
                                                                    alreadySent
                                                                        ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                                                                        : 'bg-slate-700 text-white hover:bg-slate-800'
                                                                }`}
                                                            >
                                                                {alreadySent ? '요청됨' : '매칭 요청'}
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'sent' && (
                                <div>
                                    {sentRequests.length === 0 ? (
                                        <div className="bg-white rounded-xl p-12 text-center">
                                            <p className="text-gray-600">보낸 매칭 요청이 없습니다</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {sentRequests.map(request => (
                                                <div key={request.id} className={`bg-white rounded-xl p-6 shadow-sm ${request.status === 'accepted' ? 'border-2 border-green-200' : ''}`}>
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex-1">
                                                            <h3 className="font-bold text-gray-800 mb-1">{request.receiverNickname}님께</h3>
                                                            <p className="text-sm text-gray-600 mb-2">{request.message}</p>
                                                            <span className={`inline-block px-3 py-1 rounded-full text-xs font-medium ${
                                                                request.status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                                                                request.status === 'accepted' ? 'bg-green-100 text-green-700' :
                                                                'bg-gray-100 text-gray-700'
                                                            }`}>
                                                                {request.status === 'pending' ? '대기 중' :
                                                                 request.status === 'accepted' ? '수락됨' : '거절됨'}
                                                            </span>
                                                        </div>
                                                        {request.status === 'accepted' && (
                                                            <button
                                                                onClick={() => handleSendMessage(request)}
                                                                className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 flex items-center gap-2"
                                                            >
                                                                <Mail size={18} /> 메시지 보내기
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {activeTab === 'received' && (
                                <div>
                                    {receivedRequests.length === 0 ? (
                                        <div className="bg-white rounded-xl p-12 text-center">
                                            <p className="text-gray-600">받은 매칭 요청이 없습니다</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {receivedRequests.map(request => (
                                                <div key={request.id} className={`bg-white rounded-xl p-6 shadow-sm ${request.status === 'accepted' ? 'border-2 border-green-200' : ''}`}>
                                                    <div className="flex items-start justify-between">
                                                        <div className="flex-1">
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <h3 className="font-bold text-gray-800">{request.senderNickname}님으로부터</h3>
                                                                {request.status === 'accepted' && (
                                                                    <span className="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full font-medium">수락됨</span>
                                                                )}
                                                                {request.status === 'rejected' && (
                                                                    <span className="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-full font-medium">거절됨</span>
                                                                )}
                                                            </div>
                                                            <p className="text-sm text-gray-600 mb-3">{request.message}</p>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            {request.status === 'pending' ? (
                                                                <>
                                                                    <button
                                                                        onClick={() => handleAcceptRequest(request)}
                                                                        className="px-4 py-2 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700"
                                                                    >
                                                                        수락
                                                                    </button>
                                                                    <button
                                                                        onClick={() => handleRejectRequest(request.id)}
                                                                        className="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg font-medium hover:bg-gray-400"
                                                                    >
                                                                        거절
                                                                    </button>
                                                                </>
                                                            ) : request.status === 'accepted' ? (
                                                                <button
                                                                    onClick={() => handleSendMessage(request)}
                                                                    className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 flex items-center gap-2"
                                                                >
                                                                    <Mail size={18} /> 메시지 보내기
                                                                </button>
                                                            ) : null}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 개인설정 페이지
        const SettingsPage = ({ user, userProfile, setUserProfile, setCurrentPage }) => {
            const [nickname, setNickname] = useState(userProfile?.nickname || '');
            const [kakaoId, setKakaoId] = useState(userProfile?.kakaoId || '');
            const [dong, setDong] = useState(userProfile?.dong || '');
            const [age, setAge] = useState(userProfile?.age || '');
            const [gender, setGender] = useState(userProfile?.gender || '');
            const [selectedInterests, setSelectedInterests] = useState(userProfile?.interests || []);
            const [loading, setLoading] = useState(false);
            const [message, setMessage] = useState('');

            const toggleInterest = (interestId) => {
                setSelectedInterests(prev =>
                    prev.includes(interestId) ? prev.filter(id => id !== interestId) : [...prev, interestId]
                );
            };

            const handleSave = async () => {
                if (!nickname || !kakaoId || !dong || !age || !gender || selectedInterests.length === 0) {
                    setMessage('모든 필수 항목을 입력해주세요');
                    return;
                }

                setLoading(true);
                try {
                    if (!userProfile?.id) {
                        setMessage('프로필 정보를 찾을 수 없습니다');
                        setLoading(false);
                        return;
                    }
                    await FirebaseUtils.updateUserProfile(userProfile.id, {
                        nickname, kakaoId, dong, age, gender, interests: selectedInterests
                    });
                    
                    const updatedProfile = await FirebaseUtils.getUserProfile(user.uid);
                    setUserProfile(updatedProfile);
                    setMessage('프로필이 업데이트되었습니다!');
                    
                    setTimeout(() => {
                        setCurrentPage('dashboard');
                    }, 1500);
                } catch (error) {
                    setMessage('저장 실패: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-bold text-gray-800">개인설정</h1>
                                <button onClick={() => setCurrentPage('dashboard')} className="text-gray-600 hover:text-gray-800">← 돌아가기</button>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-8">
                        <div className="max-w-2xl mx-auto bg-white rounded-xl shadow-sm p-6">
                            {message && (
                                <div className={`mb-4 p-3 rounded-lg ${message.includes('성공') || message.includes('업데이트') ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>
                                    {message}
                                </div>
                            )}

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium mb-2">닉네임</label>
                                    <input type="text" value={nickname} onChange={(e) => setNickname(e.target.value)} className="w-full px-4 py-2 border rounded-lg" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2">카카오톡 ID</label>
                                    <input type="text" value={kakaoId} onChange={(e) => setKakaoId(e.target.value)} className="w-full px-4 py-2 border rounded-lg" />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2">동</label>
                                    <select value={dong} onChange={(e) => setDong(e.target.value)} className="w-full px-4 py-2 border rounded-lg">
                                        <option value="">선택하세요</option>
                                        <option value="6201">6201동</option>
                                        <option value="6202">6202동</option>
                                        <option value="6203">6203동</option>
                                        <option value="6204">6204동</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2">연령대</label>
                                    <select value={age} onChange={(e) => setAge(e.target.value)} className="w-full px-4 py-2 border rounded-lg">
                                        <option value="">선택하세요</option>
                                        <option value="20s">20대</option>
                                        <option value="30s">30대</option>
                                        <option value="40s">40대</option>
                                        <option value="50s">50대 이상</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2">성별</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button type="button" onClick={() => setGender('male')} className={`px-4 py-3 rounded-lg border-2 text-sm ${gender === 'male' ? 'border-slate-500 bg-slate-50 font-medium' : 'border-gray-200 text-gray-600'}`}>
                                            남성
                                        </button>
                                        <button type="button" onClick={() => setGender('female')} className={`px-4 py-3 rounded-lg border-2 text-sm ${gender === 'female' ? 'border-slate-500 bg-slate-50 font-medium' : 'border-gray-200 text-gray-600'}`}>
                                            여성
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-3">관심사</label>
                                    <div className="space-y-4 max-h-96 overflow-y-auto border rounded-lg p-4">
                                        {Object.entries(interestCategories).map(([category, items]) => (
                                            <div key={category}>
                                                <h3 className="text-sm font-semibold text-gray-700 mb-2">{category}</h3>
                                                <div className="grid grid-cols-3 gap-2">
                                                    {items.map(interest => {
                                                        const isSelected = selectedInterests.includes(interest.id);
                                                        return (
                                                            <button key={interest.id} type="button" onClick={() => toggleInterest(interest.id)}
                                                                className={`px-3 py-2 rounded-lg text-xs font-medium transition-all ${isSelected ? `${interest.color} ring-2 ring-slate-400` : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>
                                                                {interest.name}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <button onClick={handleSave} disabled={loading} className="w-full bg-slate-700 text-white py-3 rounded-lg font-medium hover:bg-slate-800 flex items-center justify-center">
                                    {loading ? <div className="loading"></div> : '저장하기'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 1:1 Direct Messages 페이지
        const DirectMessagesPage = ({ user, userProfile, setCurrentPage }) => {
            const [threads, setThreads] = useState([]);
            const [selectedThread, setSelectedThread] = useState(null);
            const [messages, setMessages] = useState([]);
            const [messageText, setMessageText] = useState('');
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                loadThreads();
            }, [user]);

            useEffect(() => {
                if (selectedThread) {
                    loadMessages();
                    // 메시지 읽음 처리
                    FirebaseUtils.markMessagesAsRead(selectedThread.id, user.uid).catch(e => console.log('읽음 처리 실패:', e));
                    const interval = setInterval(loadMessages, 3000); // Poll for new messages
                    return () => clearInterval(interval);
                }
            }, [selectedThread]);

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            const loadThreads = async () => {
                try {
                    const userThreads = await FirebaseUtils.getUserDirectMessages(user.uid);
                    setThreads(userThreads);
                } catch (error) {
                    console.error('스레드 로드 실패:', error);
                } finally {
                    setLoading(false);
                }
            };

            const loadMessages = async () => {
                if (!selectedThread) return;
                try {
                    const msgs = await FirebaseUtils.getDirectMessages(selectedThread.id);
                    setMessages(msgs);
                } catch (error) {
                    console.error('메시지 로드 실패:', error);
                }
            };

            const handleSendMessage = async () => {
                if (!messageText.trim() || !selectedThread) return;

                try {
                    await FirebaseUtils.sendDirectMessage(
                        selectedThread.id,
                        user.uid,
                        userProfile?.nickname,
                        messageText
                    );

                    setMessageText('');
                    loadMessages();
                    loadThreads();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const getOtherUser = (thread) => {
                return thread.participants?.find(p => p.userId !== user.uid);
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-bold text-gray-800">1:1 메시지</h1>
                                <button onClick={() => setCurrentPage('dashboard')} className="text-gray-600 hover:text-gray-800">← 돌아가기</button>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-8">
                        <div className="max-w-6xl mx-auto flex gap-4 h-[600px]">
                            {/* Thread List */}
                            <div className="w-1/3 bg-white rounded-xl shadow-sm overflow-y-auto">
                                <div className="p-4 border-b">
                                    <h2 className="font-semibold text-gray-800">대화 목록</h2>
                                </div>
                                {loading ? (
                                    <div className="p-8 text-center">
                                        <div className="loading"></div>
                                    </div>
                                ) : threads.length === 0 ? (
                                    <div className="p-8 text-center text-gray-500">
                                        <Mail size={48} className="mx-auto mb-4 text-gray-300" />
                                        <p>메시지가 없습니다</p>
                                        <p className="text-sm mt-2">1:1 매칭에서 대화를 시작하세요</p>
                                    </div>
                                ) : (
                                    <div className="divide-y">
                                        {threads.map(thread => {
                                            const otherUser = getOtherUser(thread);
                                            return (
                                                <div
                                                    key={thread.id}
                                                    onClick={() => setSelectedThread(thread)}
                                                    className={`p-4 cursor-pointer hover:bg-gray-50 ${selectedThread?.id === thread.id ? 'bg-slate-50' : ''}`}
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 bg-slate-500 rounded-full flex items-center justify-center text-white text-sm font-medium">
                                                            {otherUser?.nickname?.[0] || '?'}
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <h3 className="font-semibold text-gray-800">{otherUser?.nickname}</h3>
                                                            <p className="text-sm text-gray-500 truncate">{thread.lastMessage || '메시지 없음'}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* Message Area */}
                            <div className="flex-1 bg-white rounded-xl shadow-sm flex flex-col">
                                {selectedThread ? (
                                    <>
                                        <div className="p-4 border-b flex items-center gap-3">
                                            <div className="w-9 h-9 bg-slate-500 rounded-full flex items-center justify-center text-white text-sm font-medium">
                                                {getOtherUser(selectedThread)?.nickname?.[0] || '?'}
                                            </div>
                                            <h2 className="font-medium text-gray-800">{getOtherUser(selectedThread)?.nickname}</h2>
                                        </div>
                                        <div className="flex-1 overflow-y-auto p-4 space-y-3 chat-container">
                                            {messages.map((msg, idx) => {
                                                const isMine = msg.senderId === user.uid;
                                                return (
                                                    <div key={idx} className={`flex ${isMine ? 'justify-end' : 'justify-start'}`}>
                                                        <div className={`message-bubble px-4 py-2 rounded-2xl ${isMine ? 'bg-slate-700 text-white' : 'bg-gray-100 text-gray-800'}`}>
                                                            <p className="text-sm">{msg.text}</p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            <div ref={messagesEndRef} />
                                        </div>
                                        <div className="p-4 border-t">
                                            <div className="flex gap-2">
                                                <input
                                                    type="text"
                                                    value={messageText}
                                                    onChange={(e) => setMessageText(e.target.value)}
                                                    onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                                                    placeholder="메시지를 입력하세요..."
                                                    className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 focus:border-slate-400"
                                                />
                                                <button onClick={handleSendMessage} className="px-6 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800 flex items-center gap-2 text-sm">
                                                    <Send size={16} /> 전송
                                                </button>
                                            </div>
                                        </div>
                                    </>
                                ) : (
                                    <div className="flex-1 flex items-center justify-center text-gray-500">
                                        <div className="text-center">
                                            <MessageCircle size={64} className="mx-auto mb-4 text-gray-300" />
                                            <p>대화를 선택하세요</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 알림 페이지
        const NotificationsPage = ({ user, userProfile, setCurrentPage }) => {
            const [notifications, setNotifications] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false });

            useEffect(() => {
                loadNotifications();
                requestNotificationPermission();
            }, [user]);

            const requestNotificationPermission = async () => {
                if ('Notification' in window && Notification.permission === 'default') {
                    await Notification.requestPermission();
                }
            };

            const loadNotifications = async () => {
                setError(null);
                try {
                    const notifs = await FirebaseUtils.getUserNotifications(user.uid);
                    setNotifications(notifs);
                } catch (err) {
                    console.error('알림 로드 실패:', err);
                    setError(getErrorMessage(err));
                } finally {
                    setLoading(false);
                }
            };

            const handleMarkAsRead = async (notifId) => {
                try {
                    await FirebaseUtils.markNotificationAsRead(notifId);
                    loadNotifications();
                } catch (err) {
                    console.error('알림 읽음 처리 실패:', err);
                }
            };

            const handleClearAll = () => {
                setConfirmModal({ isOpen: true });
            };

            const confirmClearAll = async () => {
                setConfirmModal({ isOpen: false });
                try {
                    await FirebaseUtils.clearAllNotifications(user.uid);
                    setToast({ message: '모든 알림이 삭제되었습니다.', type: 'success' });
                    loadNotifications();
                } catch (err) {
                    setToast({ message: getErrorMessage(err), type: 'error' });
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {/* Toast 알림 */}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {/* 확인 모달 */}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title="알림 삭제"
                        message="모든 알림을 삭제하시겠습니까?"
                        onConfirm={confirmClearAll}
                        onCancel={() => setConfirmModal({ isOpen: false })}
                        confirmText="삭제"
                        danger={true}
                    />

                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-bold text-gray-800">알림</h1>
                                <div className="flex items-center gap-3">
                                    {notifications.length > 0 && (
                                        <button onClick={handleClearAll} className="text-sm text-red-600 hover:text-red-700">
                                            모두 삭제
                                        </button>
                                    )}
                                    <button onClick={() => setCurrentPage('dashboard')} className="text-gray-600 hover:text-gray-800">← 돌아가기</button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-8">
                        <div className="max-w-3xl mx-auto">
                            {/* 에러 표시 */}
                            {error && <ErrorDisplay error={error} onRetry={loadNotifications} />}

                            {loading ? (
                                <div className="text-center py-12">
                                    <div className="loading"></div>
                                </div>
                            ) : notifications.length === 0 ? (
                                <div className="bg-white rounded-xl p-12 text-center">
                                    <Bell size={64} className="mx-auto mb-4 text-gray-300" />
                                    <h3 className="text-xl font-bold text-gray-800 mb-2">알림이 없습니다</h3>
                                    <p className="text-gray-600">새로운 알림이 오면 여기에 표시됩니다</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {notifications.map(notif => (
                                        <div
                                            key={notif.id}
                                            className={`bg-white rounded-xl p-4 shadow-sm cursor-pointer hover:shadow-md transition-shadow ${notif.read ? 'opacity-60' : ''}`}
                                            onClick={() => !notif.read && handleMarkAsRead(notif.id)}
                                        >
                                            <div className="flex items-start gap-3">
                                                <div className={`p-2 rounded-full ${notif.type === 'match_request' ? 'bg-pink-100 text-pink-600' : notif.type === 'new_message' ? 'bg-blue-100 text-blue-600' : 'bg-green-100 text-green-600'}`}>
                                                    {notif.type === 'match_request' ? <Heart size={20} /> : notif.type === 'new_message' ? <Mail size={20} /> : <Bell size={20} />}
                                                </div>
                                                <div className="flex-1">
                                                    <h3 className="font-semibold text-gray-800">{notif.title}</h3>
                                                    <p className="text-sm text-gray-600 mt-1">{notif.message}</p>
                                                    <p className="text-xs text-gray-400 mt-2">
                                                        {notif.createdAt?.toDate?.()?.toLocaleString('ko-KR') || '방금 전'}
                                                    </p>
                                                </div>
                                                {!notif.read && (
                                                    <div className="w-2 h-2 bg-slate-600 rounded-full"></div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 북마크 페이지
        const BookmarksPage = ({ user, userProfile, setCurrentPage }) => {
            const [bookmarks, setBookmarks] = useState([]);
            const [events, setEvents] = useState([]);
            const [chatRooms, setChatRooms] = useState([]);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [activeTab, setActiveTab] = useState('events'); // events or chatrooms

            useEffect(() => {
                loadBookmarks();
            }, [user]);

            const loadBookmarks = async () => {
                setLoading(true);
                try {
                    const [userBookmarks, allEvents, allChatRooms] = await Promise.all([
                        FirebaseUtils.getUserBookmarks(user.uid),
                        FirebaseUtils.getEvents(),
                        FirebaseUtils.getChatRooms()
                    ]);

                    setBookmarks(userBookmarks);

                    // Filter bookmarked items
                    const eventBookmarks = userBookmarks.filter(b => b.itemType === 'event');
                    const chatroomBookmarks = userBookmarks.filter(b => b.itemType === 'chatroom');

                    const bookmarkedEvents = allEvents.filter(e => eventBookmarks.some(b => b.itemId === e.id));
                    const bookmarkedChatRooms = allChatRooms.filter(r => chatroomBookmarks.some(b => b.itemId === r.id));

                    setEvents(bookmarkedEvents);
                    setChatRooms(bookmarkedChatRooms);
                } catch (error) {
                    console.error('북마크 로드 실패:', error);
                } finally {
                    setLoading(false);
                }
            };

            const handleRemoveBookmark = async (itemType, itemId) => {
                try {
                    await FirebaseUtils.removeBookmark(user.uid, itemType, itemId);
                    setToast({ message: '북마크가 해제되었습니다.', type: 'info' });
                    loadBookmarks();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleGoToEvent = (event) => {
                if (event.chatRoomId) {
                    window.eventToJoin = event;
                    setCurrentPage('events');
                }
            };

            const handleGoToChatRoom = (room) => {
                window.chatRoomToJoin = room;
                setCurrentPage('chatrooms');
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-bold text-gray-800">즐겨찾기</h1>
                                <button onClick={() => setCurrentPage('dashboard')} className="text-gray-600 hover:text-gray-800">← 돌아가기</button>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-8">
                        <div className="max-w-4xl mx-auto">
                            <div className="flex gap-1 mb-6 bg-gray-100 rounded-lg p-1">
                                <button
                                    onClick={() => setActiveTab('events')}
                                    className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'events' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    이벤트 ({events.length})
                                </button>
                                <button
                                    onClick={() => setActiveTab('chatrooms')}
                                    className={`flex-1 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'chatrooms' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                >
                                    모임방 ({chatRooms.length})
                                </button>
                            </div>

                            {loading ? (
                                <div className="text-center py-12">
                                    <div className="loading"></div>
                                </div>
                            ) : (
                                <>
                                    {activeTab === 'events' && (
                                        events.length === 0 ? (
                                            <div className="bg-white rounded-xl p-12 text-center">
                                                <Bookmark size={64} className="mx-auto mb-4 text-gray-300" />
                                                <h3 className="text-xl font-bold text-gray-800 mb-2">북마크한 이벤트가 없습니다</h3>
                                                <p className="text-gray-600">관심있는 이벤트를 저장해보세요</p>
                                            </div>
                                        ) : (
                                            <div className="grid gap-4">
                                                {events.map(event => {
                                                    const interest = interests.find(i => i.id === event.interestId);
                                                    return (
                                                        <div key={event.id} className="bg-white rounded-xl shadow-sm p-6 hover:shadow-md transition-shadow">
                                                            <div className="flex items-start justify-between">
                                                                <div className="flex-1 cursor-pointer" onClick={() => handleGoToEvent(event)}>
                                                                    <div className="flex items-center gap-3 mb-2">
                                                                        {interest && <span className={`px-3 py-1 rounded-full text-xs font-medium ${interest.color}`}>{interest.name}</span>}
                                                                        <span className="text-sm text-gray-500">{event.participants?.length || 0}/{event.maxParticipants || '∞'}명</span>
                                                                    </div>
                                                                    <h3 className="text-lg font-bold text-gray-800 mb-2">{event.title}</h3>
                                                                    <p className="text-gray-600 text-sm mb-2">{event.description}</p>
                                                                    <div className="flex flex-col gap-1 text-sm text-gray-500">
                                                                        <span>📅 {event.eventDate ? new Date(event.eventDate).toLocaleString('ko-KR') : '날짜 미정'}</span>
                                                                        <span>📍 {event.location}</span>
                                                                    </div>
                                                                </div>
                                                                <button
                                                                    onClick={() => handleRemoveBookmark('event', event.id)}
                                                                    className="ml-4 p-2 text-yellow-600 hover:bg-yellow-50 rounded-lg"
                                                                >
                                                                    <Bookmark size={24} fill="currentColor" />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )
                                    )}

                                    {activeTab === 'chatrooms' && (
                                        chatRooms.length === 0 ? (
                                            <div className="bg-white rounded-xl p-12 text-center">
                                                <Bookmark size={64} className="mx-auto mb-4 text-gray-300" />
                                                <h3 className="text-xl font-bold text-gray-800 mb-2">북마크한 모임방이 없습니다</h3>
                                                <p className="text-gray-600">자주 가는 모임방을 저장해보세요</p>
                                            </div>
                                        ) : (
                                            <div className="grid gap-4">
                                                {chatRooms.map(room => {
                                                    const interest = interests.find(i => i.id === room.interestId);
                                                    return (
                                                        <div key={room.id} className="bg-white rounded-xl shadow-sm p-6 hover:shadow-md transition-shadow">
                                                            <div className="flex items-start justify-between">
                                                                <div className="flex-1 cursor-pointer" onClick={() => handleGoToChatRoom(room)}>
                                                                    <div className="flex items-center gap-3 mb-2">
                                                                        {interest && <span className={`px-3 py-1 rounded-full text-xs font-medium ${interest.color}`}>{interest.name}</span>}
                                                                        {room.isEventChat && <span className="px-3 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-700">이벤트 채팅</span>}
                                                                        <span className="text-sm text-gray-500">{room.members?.length || 0}명</span>
                                                                    </div>
                                                                    <h3 className="text-lg font-bold text-gray-800 mb-2">{room.name}</h3>
                                                                    <p className="text-gray-600 text-sm">{room.description}</p>
                                                                </div>
                                                                <button
                                                                    onClick={() => handleRemoveBookmark('chatroom', room.id)}
                                                                    className="ml-4 p-2 text-yellow-600 hover:bg-yellow-50 rounded-lg"
                                                                >
                                                                    <Bookmark size={24} fill="currentColor" />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 통계 대시보드 페이지
        const StatisticsPage = ({ setCurrentPage }) => {
            const [stats, setStats] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                loadStatistics();
            }, []);

            const loadStatistics = async () => {
                try {
                    const statistics = await FirebaseUtils.getStatistics();
                    setStats(statistics);
                } catch (error) {
                    console.error('통계 로드 실패:', error);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-bold text-gray-800">커뮤니티 통계</h1>
                                <button onClick={() => setCurrentPage('dashboard')} className="text-gray-600 hover:text-gray-800">← 돌아가기</button>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-8">
                        <div className="max-w-6xl mx-auto">
                            {loading ? (
                                <div className="text-center py-12">
                                    <div className="loading"></div>
                                    <p className="mt-4 text-gray-600">통계를 불러오는 중...</p>
                                </div>
                            ) : stats ? (
                                <>
                                    {/* Summary Cards */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                                        <div className="bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-xl p-6">
                                            <div className="flex items-center justify-between mb-2">
                                                <h3 className="text-sm font-medium opacity-90">전체 사용자</h3>
                                                <Users size={24} className="opacity-80" />
                                            </div>
                                            <p className="text-3xl font-bold">{stats.totalUsers}</p>
                                        </div>

                                        <div className="bg-gradient-to-br from-purple-500 to-pink-600 text-white rounded-xl p-6">
                                            <div className="flex items-center justify-between mb-2">
                                                <h3 className="text-sm font-medium opacity-90">진행 중 이벤트</h3>
                                                <Calendar size={24} className="opacity-80" />
                                            </div>
                                            <p className="text-3xl font-bold">{stats.totalEvents}</p>
                                        </div>

                                        <div className="bg-gradient-to-br from-green-500 to-emerald-600 text-white rounded-xl p-6">
                                            <div className="flex items-center justify-between mb-2">
                                                <h3 className="text-sm font-medium opacity-90">활성 모임방</h3>
                                                <MessageCircle size={24} className="opacity-80" />
                                            </div>
                                            <p className="text-3xl font-bold">{stats.totalChatRooms}</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        {/* Top Interests */}
                                        <div className="bg-white rounded-xl shadow-sm p-6">
                                            <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                                <Star size={20} className="text-yellow-500" fill="currentColor" />
                                                인기 관심사 TOP 10
                                            </h2>
                                            <div className="space-y-3">
                                                {stats.topInterests.map((item, idx) => {
                                                    const interest = interests.find(i => i.id === item.id);
                                                    return (
                                                        <div key={item.id} className="flex items-center gap-3">
                                                            <span className="text-lg font-bold text-gray-400 w-6">{idx + 1}</span>
                                                            {interest && (
                                                                <span className={`px-3 py-1 rounded-full text-sm font-medium ${interest.color} flex-1`}>
                                                                    {interest.name}
                                                                </span>
                                                            )}
                                                            <span className="text-sm font-semibold text-gray-600">{item.count}명</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        {/* Age Distribution */}
                                        <div className="bg-white rounded-xl shadow-sm p-6">
                                            <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                                <BarChart size={20} className="text-slate-600" />
                                                연령대 분포
                                            </h2>
                                            <div className="space-y-4">
                                                {Object.entries(stats.ageDistribution).map(([age, count]) => {
                                                    const percentage = (count / stats.totalUsers * 100).toFixed(1);
                                                    const ageLabel = age === '20s' ? '20대' : age === '30s' ? '30대' : age === '40s' ? '40대' : age === '50s' ? '50대 이상' : '미정';
                                                    return (
                                                        <div key={age}>
                                                            <div className="flex items-center justify-between mb-1">
                                                                <span className="text-sm font-medium text-gray-700">{ageLabel}</span>

        // 게시글 상세 모달 (댓글 기능 포함)
        const PostDetailModal = ({ post, onClose, user, userProfile, onUpdate }) => {
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState('');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, commentId: null });
            const [editingCommentId, setEditingCommentId] = useState(null);
            const [editCommentContent, setEditCommentContent] = useState('');
            const hasLiked = post.likes?.includes(user.uid);

            useEffect(() => {
                loadComments();
            }, [post.id]);

            const loadComments = async () => {
                try {
                    const { firestore, db } = getFirebase();
                    const q = firestore.query(
                        firestore.collection(db, 'posts', post.id, 'comments'),
                        firestore.orderBy('createdAt', 'asc')
                    );
                    const querySnapshot = await firestore.getDocs(q);
                    const commentsData = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setComments(commentsData);
                } catch (error) {
                    console.error('댓글 로드 실패:', error);
                }
            };

            const handleAddComment = async () => {
                if (!newComment.trim()) return;

                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();

                    await firestore.addDoc(firestore.collection(db, 'posts', post.id, 'comments'), {
                        content: newComment.trim(),
                        authorId: user.uid,
                        authorNickname: userProfile?.nickname || '익명',
                        createdAt: firestore.serverTimestamp()
                    });

                    // 댓글 카운트 업데이트
                    const postRef = firestore.doc(db, 'posts', post.id);
                    await firestore.updateDoc(postRef, {
                        commentCount: (post.commentCount || 0) + 1
                    });

                    setNewComment('');
                    loadComments();
                    onUpdate();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteComment = (commentId) => {
                setConfirmModal({ isOpen: true, commentId });
            };

            const handleEditComment = (comment) => {
                setEditingCommentId(comment.id);
                setEditCommentContent(comment.content);
            };

            const handleCancelEdit = () => {
                setEditingCommentId(null);
                setEditCommentContent('');
            };

            const handleUpdateComment = async (commentId) => {
                if (!editCommentContent.trim()) return;
                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.updateDoc(firestore.doc(db, 'posts', post.id, 'comments', commentId), {
                        content: editCommentContent.trim(),
                        updatedAt: firestore.serverTimestamp()
                    });
                    setEditingCommentId(null);
                    setEditCommentContent('');
                    setToast({ message: '댓글이 수정되었습니다.', type: 'success' });
                    loadComments();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const confirmDeleteComment = async () => {
                const commentId = confirmModal.commentId;
                setConfirmModal({ isOpen: false, commentId: null });

                try {
                    const { firestore, db } = getFirebase();

                    await firestore.deleteDoc(firestore.doc(db, 'posts', post.id, 'comments', commentId));

                    // 댓글 카운트 업데이트
                    const postRef = firestore.doc(db, 'posts', post.id);
                    await firestore.updateDoc(postRef, {
                        commentCount: Math.max(0, (post.commentCount || 0) - 1)
                    });

                    setToast({ message: '댓글이 삭제되었습니다.', type: 'success' });
                    loadComments();
                    onUpdate();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleLike = async () => {
                try {
                    const { firestore, db } = getFirebase();
                    const postRef = firestore.doc(db, 'posts', post.id);

                    const likes = post.likes || [];
                    if (hasLiked) {
                        await firestore.updateDoc(postRef, {
                            likes: firestore.arrayRemove(user.uid)
                        });
                    } else {
                        await firestore.updateDoc(postRef, {
                            likes: likes.concat([user.uid])
                        });
                    }

                    onUpdate();
                } catch (error) {
                    console.error('좋아요 실패:', error);
                }
            };

            const interest = interests.find(i => i.id === post.interestId);

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[60]">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title="댓글 삭제"
                        message="댓글을 삭제하시겠습니까?"
                        onConfirm={confirmDeleteComment}
                        onCancel={() => setConfirmModal({ isOpen: false, commentId: null })}
                        confirmText="삭제"
                        danger={true}
                    />
                    <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">

                                        </span>
                                    )}
                                </div>
                                <h3 className="text-2xl font-bold text-gray-800 mb-3">{post.title}</h3>
                                <div className="flex items-center gap-3 text-sm text-gray-500 mb-4">
                                    <span>{post.authorNickname}</span>
                                    <span>•</span>
                                    <span>{post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString('ko-KR') : '-'}</span>
                                </div>
                                <p className="text-gray-700 whitespace-pre-wrap mb-4">{post.content}</p>

                                <div className="flex items-center gap-4 pt-4 border-t">

                                        }`}
                                    >
                                        <ThumbsUp size={20} fill={hasLiked ? 'currentColor' : 'none'} />
                                        <span>좋아요 {post.likes?.length || 0}</span>

                                </div>
                            </div>

                            {/* 댓글 목록 */}

                                <div className="space-y-4 mb-4">
                                    {comments.map(comment => (
                                        <div key={comment.id} className="bg-gray-50 rounded-lg p-4">
                                            <div className="flex items-start justify-between mb-2">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-1">

                                                        {comment.updatedAt && <span className="text-xs text-gray-400">(수정됨)</span>}
                                                    </div>
                                                    {editingCommentId === comment.id ? (
