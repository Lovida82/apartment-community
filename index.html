                                    {filteredPosts.length > displayCount && (
                                        <button
                                            onClick={() => setDisplayCount(prev => prev + 10)}
                                            className="w-full py-3 text-emerald-600 hover:bg-emerald-50 rounded-lg border border-emerald-200 font-medium"
                                        >
                                            더 보기
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 작성 모달 */}
                    {showCreateModal && (
                        <CreateRecommendationModal
                            user={user}
                            userProfile={userProfile}
                            onClose={() => setShowCreateModal(false)}
                            onCreated={loadPosts}
                        />
                    )}

                    {/* 수정 모달 */}
                    {showEditModal && editingPost && (
                        <EditRecommendationModal
                            post={editingPost}
                            onClose={() => { setShowEditModal(false); setEditingPost(null); }}
                            onSuccess={() => {
                                setShowEditModal(false);
                                setEditingPost(null);
                                loadPosts();
                                setToast({ message: '추천글이 수정되었습니다.', type: 'success' });
                            }}
                        />
                    )}

                    {/* 상세 모달 */}
                    {selectedPost && (
                        <RecommendationDetailModal
                            post={selectedPost}
                            user={user}
                            userProfile={userProfile}
                            onClose={() => setSelectedPost(null)}
                            onUpdated={loadPosts}
                        />
                    )}
                </div>
            );
        };

        // 추천 수정 모달
        const EditRecommendationModal = ({ post, onClose, onSuccess }) => {
            const [category, setCategory] = useState(post.category || 'restaurant');
            const [storeName, setStoreName] = useState(post.storeName || '');
            const [location, setLocation] = useState(post.location || '');
            const [title, setTitle] = useState(post.title || '');
            const [content, setContent] = useState(post.content || '');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);

            const handleSubmit = async () => {
                if (!title.trim() || !content.trim() || !storeName.trim()) {
                    setToast({ message: '업체명, 제목, 내용을 모두 입력해주세요', type: 'error' });
                    return;
                }

                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.updateDoc(firestore.doc(db, 'recommendations', post.id), {
                        category,
                        storeName: storeName.trim(),
                        location: location.trim(),
                        title: title.trim(),
                        content: content.trim(),
                        updatedAt: firestore.serverTimestamp()
                    });
                    onSuccess();
                } catch (err) {
                    console.error('수정 실패:', err);
                    setToast({ message: getErrorMessage(err), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <div className="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
                        <div className="p-6 border-b flex items-center justify-between">
                            <h2 className="text-xl font-bold">추천글 수정</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700"><X size={24} /></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">카테고리</label>
                                <select
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                >
                                    {recommendationCategories.map(cat => (
                                        <option key={cat.id} value={cat.id}>{cat.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">업체명</label>
                                <input
                                    type="text"
                                    value={storeName}
                                    onChange={(e) => setStoreName(e.target.value)}
                                    className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                    placeholder="예: 맛있는 식당"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">위치 (선택)</label>
                                <input
                                    type="text"
                                    value={location}
                                    onChange={(e) => setLocation(e.target.value)}
                                    className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                    placeholder="예: 아파트 정문 앞"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">제목</label>
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                    placeholder="추천 제목을 입력하세요"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">내용</label>
                                <textarea
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                    className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-emerald-400 resize-none"
                                    rows={5}
                                    placeholder="추천 이유나 후기를 작성해주세요"
                                />
                            </div>
                            <button
                                onClick={handleSubmit}
                                disabled={loading}
                                className="w-full bg-emerald-600 text-white py-3 rounded-lg font-medium hover:bg-emerald-700 disabled:bg-gray-400 flex items-center justify-center"
                            >
                                {loading ? <div className="loading"></div> : '수정 완료'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 추천 작성 모달
        const CreateRecommendationModal = ({ user, userProfile, onClose, onCreated }) => {
            const [category, setCategory] = useState('restaurant');
            const [storeName, setStoreName] = useState('');
            const [location, setLocation] = useState('');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);

            const handleSubmit = async () => {
                if (!title.trim() || !content.trim() || !storeName.trim()) {
                    setToast({ message: '업체명, 제목, 내용을 모두 입력해주세요', type: 'error' });
                    return;
                }

                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.addDoc(firestore.collection(db, 'recommendations'), {
                        category,
                        storeName: storeName.trim(),
                        location: location.trim(),
                        title: title.trim(),
                        content: content.trim(),
                        authorId: user.uid,
                        authorNickname: userProfile?.nickname || '익명',
                        likes: [],
                        commentCount: 0,
                        createdAt: firestore.serverTimestamp()
                    });
                    setToast({ message: '추천이 등록되었습니다.', type: 'success' });
                    setTimeout(() => {
                        onCreated();
                        onClose();
                    }, 1500);
                } catch (error) {
                    console.error('작성 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <div className="bg-white rounded-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
                            <h2 className="text-lg font-semibold">추천 작성</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <X size={24} />
                            </button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">카테고리</label>
                                <select
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                >
                                    {recommendationCategories.map(cat => (
                                        <option key={cat.id} value={cat.id}>{cat.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">업체명 *</label>
                                <input
                                    type="text"
                                    value={storeName}
                                    onChange={(e) => setStoreName(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                    placeholder="업체명을 입력하세요"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">위치 (선택)</label>
                                <input
                                    type="text"
                                    value={location}
                                    onChange={(e) => setLocation(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                    placeholder="주소나 위치 설명"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">제목 *</label>
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                    placeholder="제목을 입력하세요"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">내용 *</label>
                                <textarea
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400 h-32 resize-none"
                                    placeholder="추천 이유나 후기를 작성해주세요"
                                />
                            </div>
                            <button
                                onClick={handleSubmit}
                                disabled={loading}
                                className="w-full bg-emerald-600 text-white py-3 rounded-lg hover:bg-emerald-700 disabled:bg-gray-300 font-medium"
                            >
                                {loading ? '등록 중...' : '등록하기'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 추천 상세 모달
        const RecommendationDetailModal = ({ post, user, userProfile, onClose, onUpdated }) => {
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState('');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, commentId: null });
            const [editingCommentId, setEditingCommentId] = useState(null);
            const [editCommentContent, setEditCommentContent] = useState('');

            useEffect(() => {
                loadComments();
            }, [post.id]);

            const loadComments = async () => {
                try {
                    const { firestore, db } = getFirebase();
                    const q = firestore.query(
                        firestore.collection(db, 'recommendations', post.id, 'comments'),
                        firestore.orderBy('createdAt', 'asc')
                    );
                    const snapshot = await firestore.getDocs(q);
                    setComments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                } catch (error) {
                    console.error('댓글 로드 실패:', error);
                }
            };

            const handleAddComment = async () => {
                if (!newComment.trim()) return;
                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.addDoc(firestore.collection(db, 'recommendations', post.id, 'comments'), {
                        content: newComment.trim(),
                        authorId: user.uid,
                        authorNickname: userProfile?.nickname || '익명',
                        createdAt: firestore.serverTimestamp()
                    });
                    await firestore.updateDoc(firestore.doc(db, 'recommendations', post.id), {
                        commentCount: firestore.increment(1)
                    });
                    setNewComment('');
                    await loadComments();
                    onUpdated();
                } catch (error) {
                    console.error('댓글 작성 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteComment = (commentId) => {
                setConfirmModal({ isOpen: true, commentId });
            };

            const handleEditComment = (comment) => {
                setEditingCommentId(comment.id);
                setEditCommentContent(comment.content);
            };

            const handleCancelEdit = () => {
                setEditingCommentId(null);
                setEditCommentContent('');
            };

            const handleUpdateComment = async (commentId) => {
                if (!editCommentContent.trim()) return;
                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.updateDoc(firestore.doc(db, 'recommendations', post.id, 'comments', commentId), {
                        content: editCommentContent.trim(),
                        updatedAt: firestore.serverTimestamp()
                    });
                    setEditingCommentId(null);
                    setEditCommentContent('');
                    setToast({ message: '댓글이 수정되었습니다.', type: 'success' });
                    await loadComments();
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const confirmDeleteComment = async () => {
                const commentId = confirmModal.commentId;
                setConfirmModal({ isOpen: false, commentId: null });
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.deleteDoc(firestore.doc(db, 'recommendations', post.id, 'comments', commentId));
                    await firestore.updateDoc(firestore.doc(db, 'recommendations', post.id), {
                        commentCount: firestore.increment(-1)
                    });
                    setToast({ message: '댓글이 삭제되었습니다.', type: 'success' });
                    await loadComments();
                    onUpdated();
                } catch (error) {
                    console.error('댓글 삭제 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleLike = async () => {
                try {
                    const { firestore, db } = getFirebase();
                    const postRef = firestore.doc(db, 'recommendations', post.id);
                    const isLiked = post.likes?.includes(user.uid);
                    await firestore.updateDoc(postRef, {
                        likes: isLiked ? firestore.arrayRemove(user.uid) : firestore.arrayUnion(user.uid)
                    });
                    onUpdated();
                    onClose();
                } catch (error) {
                    console.error('좋아요 실패:', error);
                }
            };

            const catInfo = recommendationCategories.find(c => c.id === post.category) || { name: '기타', color: 'bg-gray-100 text-gray-700' };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title="댓글 삭제"
                        message="댓글을 삭제하시겠습니까?"
                        onConfirm={confirmDeleteComment}
                        onCancel={() => setConfirmModal({ isOpen: false, commentId: null })}
                        confirmText="삭제"
                        danger={true}
                    />
                    <div className="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${catInfo.color}`}>
                                    {catInfo.name}
                                </span>
                                {post.storeName && (
                                    <span className="text-sm font-medium text-emerald-700">{post.storeName}</span>
                                )}
                            </div>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <X size={24} />
                            </button>
                        </div>
                        <div className="p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">{post.title}</h2>
                            <div className="flex items-center gap-2 text-sm text-gray-500 mb-4">
                                <span className="font-medium">{post.authorNickname}</span>
                                <span>·</span>
                                <span>{post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString('ko-KR') : '-'}</span>
                            </div>
                            {post.location && (
                                <p className="text-sm text-gray-600 mb-4 flex items-center gap-1">
                                    <MapPin size={16} className="text-emerald-600" /> {post.location}
                                </p>
                            )}
                            <p className="text-gray-700 whitespace-pre-wrap mb-6">{post.content}</p>

                            <button
                                onClick={handleLike}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg border ${post.likes?.includes(user.uid) ? 'bg-red-50 border-red-200 text-red-600' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                            >
                                <ThumbsUp size={18} fill={post.likes?.includes(user.uid) ? 'currentColor' : 'none'} />
                                좋아요 {post.likes?.length || 0}
                            </button>

                            {/* 댓글 */}
                            <div className="mt-8 border-t pt-6">
                                <h3 className="font-semibold text-gray-800 mb-4">댓글 {comments.length}개</h3>
                                <div className="space-y-4 mb-4">
                                    {comments.map(comment => (
                                        <div key={comment.id} className="flex gap-3 p-3 bg-gray-50 rounded-lg">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="font-medium text-sm">{comment.authorNickname}</span>
                                                    <span className="text-xs text-gray-500">
                                                        {comment.createdAt ? new Date(comment.createdAt.seconds * 1000).toLocaleString('ko-KR') : '-'}
                                                    </span>
                                                    {comment.updatedAt && <span className="text-xs text-gray-400">(수정됨)</span>}
                                                </div>
                                                {editingCommentId === comment.id ? (
                                                    <div className="mt-2">
                                                        <input
                                                            type="text"
                                                            value={editCommentContent}
                                                            onChange={(e) => setEditCommentContent(e.target.value)}
                                                            className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 text-sm"
                                                            autoFocus
                                                        />
                                                        <div className="flex gap-2 mt-2">
                                                            <button onClick={() => handleUpdateComment(comment.id)} disabled={loading} className="px-3 py-1 bg-emerald-600 text-white rounded text-sm hover:bg-emerald-700 disabled:bg-gray-400">저장</button>
                                                            <button onClick={handleCancelEdit} className="px-3 py-1 bg-gray-200 text-gray-700 rounded text-sm hover:bg-gray-300">취소</button>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <p className="text-gray-700 text-sm">{comment.content}</p>
                                                )}
                                            </div>
                                            {comment.authorId === user.uid && editingCommentId !== comment.id && (
                                                <div className="flex items-center gap-1">
                                                    <button onClick={() => handleEditComment(comment)} className="text-blue-600 hover:text-blue-800 p-1">
                                                        <Edit size={16} />
                                                    </button>
                                                    <button onClick={() => handleDeleteComment(comment.id)} className="text-red-600 hover:text-red-800 p-1">
                                                        <Trash size={16} />
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={newComment}
                                        onChange={(e) => setNewComment(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleAddComment()}
                                        className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                        placeholder="댓글을 입력하세요"
                                        disabled={loading}
                                    />
                                    <button
                                        onClick={handleAddComment}
                                        disabled={loading || !newComment.trim()}
                                        className="bg-emerald-600 text-white px-6 py-2 rounded-lg hover:bg-emerald-700 disabled:bg-gray-200 disabled:text-gray-400"
                                    >
                                        {loading ? '...' : '등록'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 나눔 게시판 카테고리
        const sharingCategories = [
            { id: 'free', name: '무료나눔', color: 'bg-green-100 text-green-700' },
            { id: 'exchange', name: '교환', color: 'bg-blue-100 text-blue-700' },
            { id: 'wanted', name: '필요해요', color: 'bg-purple-100 text-purple-700' },
        ];

        // 나눔 게시판 페이지
        const SharingPage = ({ user, userProfile, setCurrentPage }) => {
            const [posts, setPosts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterCategory, setFilterCategory] = useState('all');
            const [filterStatus, setFilterStatus] = useState('all');
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editingPost, setEditingPost] = useState(null);
            const [selectedPost, setSelectedPost] = useState(null);
            const [displayCount, setDisplayCount] = useState(10);
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, postId: null });

            useEffect(() => {
                loadPosts();
            }, []);

            const loadPosts = async () => {
                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    const q = firestore.query(
                        firestore.collection(db, 'sharing'),
                        firestore.orderBy('createdAt', 'desc')
                    );
                    const snapshot = await firestore.getDocs(q);
                    const postsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPosts(postsData);
                } catch (error) {
                    console.error('게시글 로드 실패:', error);
                } finally {
                    setLoading(false);
                }
            };

            const handleLike = async (postId) => {
                try {
                    const { firestore, db } = getFirebase();
                    const postRef = firestore.doc(db, 'sharing', postId);
                    const post = posts.find(p => p.id === postId);
                    const isLiked = post.likes?.includes(user.uid);

                    await firestore.updateDoc(postRef, {
                        likes: isLiked
                            ? firestore.arrayRemove(user.uid)
                            : firestore.arrayUnion(user.uid)
                    });
                    await loadPosts();
                } catch (error) {
                    console.error('좋아요 실패:', error);
                }
            };

            const handleDelete = (postId) => {
                setConfirmModal({ isOpen: true, postId });
            };

            const confirmDelete = async () => {
                const postId = confirmModal.postId;
                setConfirmModal({ isOpen: false, postId: null });
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.deleteDoc(firestore.doc(db, 'sharing', postId));
                    setToast({ message: '삭제되었습니다.', type: 'success' });
                    await loadPosts();
                } catch (error) {
                    console.error('삭제 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleToggleStatus = async (postId, currentStatus) => {
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.updateDoc(firestore.doc(db, 'sharing', postId), {
                        status: currentStatus === 'available' ? 'completed' : 'available'
                    });
                    await loadPosts();
                } catch (error) {
                    console.error('상태 변경 실패:', error);
                }
            };

            const handleEdit = (post) => {
                setEditingPost(post);
                setShowEditModal(true);
            };

            const filteredPosts = posts.filter(post => {
                const matchSearch = post.title?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    post.content?.toLowerCase().includes(searchTerm.toLowerCase());
                const matchCategory = filterCategory === 'all' || post.category === filterCategory;
                const matchStatus = filterStatus === 'all' || post.status === filterStatus;
                return matchSearch && matchCategory && matchStatus;
            });

            const getCategoryInfo = (categoryId) => {
                return sharingCategories.find(c => c.id === categoryId) || { name: '기타', color: 'bg-gray-100 text-gray-700' };
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title="게시글 삭제"
                        message="정말 삭제하시겠습니까?"
                        onConfirm={confirmDelete}
                        onCancel={() => setConfirmModal({ isOpen: false, postId: null })}
                        confirmText="삭제"
                        danger={true}
                    />
                    {/* 헤더 */}
                    <header className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setCurrentPage('dashboard')} className="text-gray-600 hover:text-gray-800">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                                        </svg>
                                    </button>
                                    <h1 className="text-lg font-semibold text-gray-800">나눔</h1>
                                </div>
                                <button
                                    onClick={() => setShowCreateModal(true)}
                                    className="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 text-sm font-medium"
                                >
                                    나눔 작성
                                </button>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-6">
                        <div className="max-w-4xl mx-auto">
                            {/* 검색 및 필터 */}
                            <div className="flex gap-3 mb-6 flex-wrap">
                                <div className="flex-1 min-w-[200px] relative">
                                    <Search size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
                                    <input
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder="제목, 내용 검색"
                                        className="w-full pl-10 pr-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400"
                                    />
                                </div>
                                <select
                                    value={filterCategory}
                                    onChange={(e) => setFilterCategory(e.target.value)}
                                    className="px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400"
                                >
                                    <option value="all">전체 카테고리</option>
                                    {sharingCategories.map(cat => (
                                        <option key={cat.id} value={cat.id}>{cat.name}</option>
                                    ))}
                                </select>
                                <select
                                    value={filterStatus}
                                    onChange={(e) => setFilterStatus(e.target.value)}
                                    className="px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400"
                                >
                                    <option value="all">전체 상태</option>
                                    <option value="available">진행중</option>
                                    <option value="completed">완료</option>
                                </select>
                            </div>

                            {/* 게시글 목록 */}
                            {loading ? (
                                <div className="text-center py-12">
                                    <div className="loading mx-auto"></div>
                                    <p className="mt-4 text-gray-500">로딩 중...</p>
                                </div>
                            ) : filteredPosts.length === 0 ? (
                                <div className="text-center py-12">
                                    <Gift size={48} className="mx-auto mb-4 text-gray-300" />
                                    <p className="text-gray-500">나눔 글이 없습니다</p>
                                    <p className="text-gray-400 text-sm mt-1">첫 번째 나눔 글을 작성해보세요!</p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {filteredPosts.slice(0, displayCount).map(post => {
                                        const catInfo = getCategoryInfo(post.category);
                                        const isCompleted = post.status === 'completed';
                                        return (
                                            <div
                                                key={post.id}
                                                className={`bg-white rounded-lg border border-gray-200 p-5 hover:border-emerald-300 transition-colors cursor-pointer ${isCompleted ? 'opacity-60' : ''}`}
                                                onClick={() => setSelectedPost(post)}
                                            >
                                                <div className="flex items-start justify-between mb-3">
                                                    <div className="flex items-center gap-2">
                                                        <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${catInfo.color}`}>
                                                            {catInfo.name}
                                                        </span>
                                                        {isCompleted && (
                                                            <span className="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600 flex items-center gap-1">
                                                                <Check size={12} /> 완료
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        {post.authorId === user.uid && (
                                                            <>
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); handleToggleStatus(post.id, post.status); }}
                                                                    className={`text-xs px-2 py-1 rounded ${isCompleted ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'} hover:opacity-80`}
                                                                >
                                                                    {isCompleted ? '진행중으로' : '완료처리'}
                                                                </button>
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); handleEdit(post); }}
                                                                    className="text-blue-500 hover:text-blue-700"
                                                                >
                                                                    <Edit size={16} />
                                                                </button>
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); handleDelete(post.id); }}
                                                                    className="text-red-500 hover:text-red-700"
                                                                >
                                                                    <Trash size={16} />
                                                                </button>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                                <h3 className={`font-semibold text-gray-800 mb-2 ${isCompleted ? 'line-through' : ''}`}>{post.title}</h3>
                                                <p className="text-gray-600 text-sm line-clamp-2 mb-3">{post.content}</p>
                                                <div className="flex items-center justify-between text-sm text-gray-500">
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-medium">{post.authorNickname}</span>
                                                        <span>·</span>
                                                        <span>{post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleDateString('ko-KR') : '-'}</span>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); handleLike(post.id); }}
                                                            className={`flex items-center gap-1 ${post.likes?.includes(user.uid) ? 'text-red-500' : 'text-gray-500'} hover:text-red-500`}
                                                        >
                                                            <ThumbsUp size={16} fill={post.likes?.includes(user.uid) ? 'currentColor' : 'none'} />
                                                            {post.likes?.length || 0}
                                                        </button>
                                                        <span className="flex items-center gap-1">
                                                            <MessageCircle size={16} />
                                                            {post.commentCount || 0}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {filteredPosts.length > displayCount && (
                                        <button
                                            onClick={() => setDisplayCount(prev => prev + 10)}
                                            className="w-full py-3 text-emerald-600 hover:bg-emerald-50 rounded-lg border border-emerald-200 font-medium"
                                        >
                                            더 보기
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 작성 모달 */}
                    {showCreateModal && (
                        <CreateSharingModal
                            user={user}
                            userProfile={userProfile}
                            onClose={() => setShowCreateModal(false)}
                            onCreated={loadPosts}
                        />
                    )}

                    {/* 수정 모달 */}
                    {showEditModal && editingPost && (
                        <EditSharingModal
                            post={editingPost}
                            onClose={() => { setShowEditModal(false); setEditingPost(null); }}
                            onUpdated={loadPosts}
                        />
                    )}

                    {/* 상세 모달 */}
                    {selectedPost && (
                        <SharingDetailModal
                            post={selectedPost}
                            user={user}
                            userProfile={userProfile}
                            onClose={() => setSelectedPost(null)}
                            onUpdated={loadPosts}
                        />
                    )}
                </div>
            );
        };

        // 나눔 작성 모달
        const CreateSharingModal = ({ user, userProfile, onClose, onCreated }) => {
            const [category, setCategory] = useState('free');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);

            const handleSubmit = async () => {
                if (!title.trim() || !content.trim()) {
                    setToast({ message: '제목과 내용을 모두 입력해주세요', type: 'error' });
                    return;
                }

                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.addDoc(firestore.collection(db, 'sharing'), {
                        category,
                        title: title.trim(),
                        content: content.trim(),
                        authorId: user.uid,
                        authorNickname: userProfile?.nickname || '익명',
                        status: 'available',
                        likes: [],
                        commentCount: 0,
                        createdAt: firestore.serverTimestamp()
                    });
                    setToast({ message: '나눔 게시글이 등록되었습니다.', type: 'success' });
                    setTimeout(() => {
                        onCreated();
                        onClose();
                    }, 1500);
                } catch (error) {
                    console.error('작성 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <div className="bg-white rounded-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
                            <h2 className="text-lg font-semibold">나눔 작성</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <X size={24} />
                            </button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">카테고리</label>
                                <select
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                >
                                    {sharingCategories.map(cat => (
                                        <option key={cat.id} value={cat.id}>{cat.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">제목 *</label>
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                    placeholder="제목을 입력하세요"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">내용 *</label>
                                <textarea
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400 h-32 resize-none"
                                    placeholder="나눔 내용을 작성해주세요"
                                />
                            </div>
                            <button
                                onClick={handleSubmit}
                                disabled={loading}
                                className="w-full bg-emerald-600 text-white py-3 rounded-lg hover:bg-emerald-700 disabled:bg-gray-300 font-medium"
                            >
                                {loading ? '등록 중...' : '등록하기'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 나눔 수정 모달
        const EditSharingModal = ({ post, onClose, onUpdated }) => {
            const [category, setCategory] = useState(post.category || 'free');
            const [title, setTitle] = useState(post.title || '');
            const [content, setContent] = useState(post.content || '');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);

            const handleSubmit = async () => {
                if (!title.trim() || !content.trim()) {
                    setToast({ message: '제목과 내용을 모두 입력해주세요', type: 'error' });
                    return;
                }

                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.updateDoc(firestore.doc(db, 'sharing', post.id), {
                        category,
                        title: title.trim(),
                        content: content.trim(),
                        updatedAt: firestore.serverTimestamp()
                    });
                    setToast({ message: '수정되었습니다.', type: 'success' });
                    setTimeout(() => {
                        onUpdated();
                        onClose();
                    }, 1000);
                } catch (error) {
                    console.error('수정 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <div className="bg-white rounded-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
                            <h2 className="text-lg font-semibold">나눔 수정</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <X size={24} />
                            </button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">카테고리</label>
                                <select
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                >
                                    {sharingCategories.map(cat => (
                                        <option key={cat.id} value={cat.id}>{cat.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">제목 *</label>
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                    placeholder="제목을 입력하세요"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">내용 *</label>
                                <textarea
                                    value={content}
                                    onChange={(e) => setContent(e.target.value)}
                                    className="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-400 h-32 resize-none"
                                    placeholder="나눔 내용을 작성해주세요"
                                />
                            </div>
                            <button
                                onClick={handleSubmit}
                                disabled={loading}
                                className="w-full bg-emerald-600 text-white py-3 rounded-lg hover:bg-emerald-700 disabled:bg-gray-300 font-medium"
                            >
                                {loading ? '수정 중...' : '수정하기'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 나눔 상세 모달
        const SharingDetailModal = ({ post, user, userProfile, onClose, onUpdated }) => {
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState('');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, commentId: null });
            const [editingCommentId, setEditingCommentId] = useState(null);
            const [editCommentText, setEditCommentText] = useState('');

            useEffect(() => {
                loadComments();
            }, [post.id]);

            const loadComments = async () => {
                try {
                    const { firestore, db } = getFirebase();
                    const q = firestore.query(
                        firestore.collection(db, 'sharing', post.id, 'comments'),
                        firestore.orderBy('createdAt', 'asc')
                    );
                    const snapshot = await firestore.getDocs(q);
                    setComments(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                } catch (error) {
                    console.error('댓글 로드 실패:', error);
                }
            };

            const handleAddComment = async () => {
                if (!newComment.trim()) return;
                setLoading(true);
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.addDoc(firestore.collection(db, 'sharing', post.id, 'comments'), {
                        content: newComment.trim(),
                        authorId: user.uid,
                        authorNickname: userProfile?.nickname || '익명',
                        createdAt: firestore.serverTimestamp()
                    });
                    await firestore.updateDoc(firestore.doc(db, 'sharing', post.id), {
                        commentCount: firestore.increment(1)
                    });
                    setNewComment('');
                    await loadComments();
                    onUpdated();
                } catch (error) {
                    console.error('댓글 작성 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const handleDeleteComment = (commentId) => {
                setConfirmModal({ isOpen: true, commentId });
            };

            const handleEditComment = (comment) => {
                setEditingCommentId(comment.id);
                setEditCommentText(comment.content);
            };

            const handleCancelEdit = () => {
                setEditingCommentId(null);
                setEditCommentText('');
            };

            const handleUpdateComment = async (commentId) => {
                if (!editCommentText.trim()) return;
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.updateDoc(firestore.doc(db, 'sharing', post.id, 'comments', commentId), {
                        content: editCommentText.trim(),
                        updatedAt: firestore.serverTimestamp()
                    });
                    setToast({ message: '댓글이 수정되었습니다.', type: 'success' });
                    setEditingCommentId(null);
                    setEditCommentText('');
                    await loadComments();
                } catch (error) {
                    console.error('댓글 수정 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const confirmDeleteComment = async () => {
                const commentId = confirmModal.commentId;
                setConfirmModal({ isOpen: false, commentId: null });
                try {
                    const { firestore, db } = getFirebase();
                    await firestore.deleteDoc(firestore.doc(db, 'sharing', post.id, 'comments', commentId));
                    await firestore.updateDoc(firestore.doc(db, 'sharing', post.id), {
                        commentCount: firestore.increment(-1)
                    });
                    setToast({ message: '댓글이 삭제되었습니다.', type: 'success' });
                    await loadComments();
                    onUpdated();
                } catch (error) {
                    console.error('댓글 삭제 실패:', error);
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleLike = async () => {
                try {
                    const { firestore, db } = getFirebase();
                    const postRef = firestore.doc(db, 'sharing', post.id);
                    const isLiked = post.likes?.includes(user.uid);
                    await firestore.updateDoc(postRef, {
                        likes: isLiked ? firestore.arrayRemove(user.uid) : firestore.arrayUnion(user.uid)
                    });
                    onUpdated();
                    onClose();
                } catch (error) {
                    console.error('좋아요 실패:', error);
                }
            };

            const catInfo = sharingCategories.find(c => c.id === post.category) || { name: '기타', color: 'bg-gray-100 text-gray-700' };
            const isCompleted = post.status === 'completed';

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title="댓글 삭제"
                        message="댓글을 삭제하시겠습니까?"
                        onConfirm={confirmDeleteComment}
                        onCancel={() => setConfirmModal({ isOpen: false, commentId: null })}
                        confirmText="삭제"
                        danger={true}
                    />
                    <div className="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                        <div className="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${catInfo.color}`}>
                                    {catInfo.name}
                                </span>
                                {isCompleted && (
                                    <span className="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600 flex items-center gap-1">
                                        <Check size={12} /> 완료
                                    </span>
                                )}
                            </div>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-700">
                                <X size={24} />
                            </button>
                        </div>
                        <div className="p-6">
                            <h2 className={`text-xl font-bold text-gray-800 mb-2 ${isCompleted ? 'line-through' : ''}`}>{post.title}</h2>
                            <div className="flex items-center gap-2 text-sm text-gray-500 mb-4">
                                <span className="font-medium">{post.authorNickname}</span>
                                <span>·</span>
                                <span>{post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleString('ko-KR') : '-'}</span>
                            </div>
                            <p className="text-gray-700 whitespace-pre-wrap mb-6">{post.content}</p>

                            <button
                                onClick={handleLike}
                                className={`flex items-center gap-2 px-4 py-2 rounded-lg border ${post.likes?.includes(user.uid) ? 'bg-red-50 border-red-200 text-red-600' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}`}
                            >
                                <ThumbsUp size={18} fill={post.likes?.includes(user.uid) ? 'currentColor' : 'none'} />
                                좋아요 {post.likes?.length || 0}
                            </button>

                            {/* 댓글 */}
                            <div className="mt-8 border-t pt-6">
                                <h3 className="font-semibold text-gray-800 mb-4">댓글 {comments.length}개</h3>
                                <div className="space-y-4 mb-4">
                                    {comments.map(comment => (
                                        <div key={comment.id} className="flex gap-3 p-3 bg-gray-50 rounded-lg">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="font-medium text-sm">{comment.authorNickname}</span>
                                                    <span className="text-xs text-gray-500">
                                                        {comment.createdAt ? new Date(comment.createdAt.seconds * 1000).toLocaleString('ko-KR') : '-'}
                                                    </span>
                                                    {comment.updatedAt && (
                                                        <span className="text-xs text-gray-400">(수정됨)</span>
                                                    )}
                                                </div>
                                                {editingCommentId === comment.id ? (
                                                    <div className="flex gap-2 mt-2">
                                                        <input
                                                            type="text"
                                                            value={editCommentText}
                                                            onChange={(e) => setEditCommentText(e.target.value)}
                                                            onKeyDown={(e) => e.key === 'Enter' && handleUpdateComment(comment.id)}
                                                            className="flex-1 px-3 py-1.5 border rounded focus:ring-2 focus:ring-emerald-400 text-sm"
                                                            autoFocus
                                                        />
                                                        <button
                                                            onClick={() => handleUpdateComment(comment.id)}
                                                            className="px-3 py-1.5 bg-emerald-600 text-white rounded text-sm hover:bg-emerald-700"
                                                        >
                                                            저장
                                                        </button>
                                                        <button
                                                            onClick={handleCancelEdit}
                                                            className="px-3 py-1.5 bg-gray-300 text-gray-700 rounded text-sm hover:bg-gray-400"
                                                        >
                                                            취소
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <p className="text-gray-700 text-sm">{comment.content}</p>
                                                )}
                                            </div>
                                            {comment.authorId === user.uid && editingCommentId !== comment.id && (
                                                <div className="flex gap-1">
                                                    <button onClick={() => handleEditComment(comment)} className="text-blue-600 hover:text-blue-800">
                                                        <Edit size={16} />
                                                    </button>
                                                    <button onClick={() => handleDeleteComment(comment.id)} className="text-red-600 hover:text-red-800">
                                                        <Trash size={16} />
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={newComment}
                                        onChange={(e) => setNewComment(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleAddComment()}
                                        className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400"
                                        placeholder="댓글을 입력하세요"
                                        disabled={loading}
                                    />
                                    <button
                                        onClick={handleAddComment}
                                        disabled={loading || !newComment.trim()}
                                        className="bg-emerald-600 text-white px-6 py-2 rounded-lg hover:bg-emerald-700 disabled:bg-gray-200 disabled:text-gray-400"
                                    >
                                        {loading ? '...' : '등록'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 앱 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
