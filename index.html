                                        </div>
                                    )}

                                    {/* 매칭 현황 */}
                                    {activeTab === 'matching' && (
                                        <div className="space-y-6">
                                            <h2 className="text-2xl font-bold text-gray-800">매칭 현황</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                                <div className="bg-white rounded-xl p-4 shadow-sm">
                                                    <p className="text-sm text-gray-500">전체 요청</p>
                                                    <p className="text-2xl font-bold text-gray-800">{matchRequests.length}</p>
                                                </div>
                                                <div className="bg-white rounded-xl p-4 shadow-sm">
                                                    <p className="text-sm text-gray-500">대기 중</p>
                                                    <p className="text-2xl font-bold text-orange-600">{pendingMatches}</p>
                                                </div>
                                                <div className="bg-white rounded-xl p-4 shadow-sm">
                                                    <p className="text-sm text-gray-500">성사됨</p>
                                                    <p className="text-2xl font-bold text-green-600">{acceptedMatches}</p>
                                                </div>
                                            </div>
                                            <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                                                {matchRequests.length === 0 ? (
                                                    <div className="p-12 text-center text-gray-500">
                                                        <Heart size={48} className="mx-auto mb-4 text-gray-300" />
                                                        <p>매칭 요청이 없습니다</p>
                                                    </div>
                                                ) : (
                                                    <div className="divide-y">
                                                        {matchRequests.map(match => (
                                                            <div key={match.id} className="p-4 hover:bg-gray-50">
                                                                <div className="flex items-center justify-between">
                                                                    <div className="flex items-center gap-4">
                                                                        <div className="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center text-sm font-medium">
                                                                            {match.senderNickname?.[0]}
                                                                        </div>
                                                                        <div className="text-gray-400">→</div>
                                                                        <div className="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center text-sm font-medium">
                                                                            {match.receiverNickname?.[0]}
                                                                        </div>
                                                                        <div>
                                                                            <p className="font-medium text-gray-800">{match.senderNickname} → {match.receiverNickname}</p>
                                                                            <p className="text-xs text-gray-500">
                                                                                {match.createdAt?.toDate?.()?.toLocaleDateString('ko-KR') || '날짜 미정'}
                                                                            </p>
                                                                        </div>
                                                                    </div>
                                                                    <span className={`px-3 py-1 rounded-full text-xs font-medium ${
                                                                        match.status === 'accepted' ? 'bg-green-100 text-green-700' :
                                                                        match.status === 'rejected' ? 'bg-red-100 text-red-700' :
                                                                        'bg-orange-100 text-orange-700'
                                                                    }`}>
                                                                        {match.status === 'accepted' ? '수락됨' : match.status === 'rejected' ? '거절됨' : '대기 중'}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}
                        </main>
                    </div>

                    {showNoticeModal && <NoticeModal />}
                </div>
            );
        };

        // 대시보드 (모바일 최적화 컴팩트 그리드)
        const DashboardPage = ({ user, userProfile, setUserProfile, setCurrentPage }) => {
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [weather, setWeather] = useState(null);
            const [popularPosts, setPopularPosts] = useState([]);
            const [loadingPopular, setLoadingPopular] = useState(true);
            const [badgeCounts, setBadgeCounts] = useState({ notices: 0, messages: 0, matching: 0 });

            useEffect(() => {
                loadWeather();
                loadPopularPosts();
                loadBadgeCounts();
            }, []);

            const loadBadgeCounts = async () => {
                try {
                    const lastNoticeChecked = userProfile?.lastNoticeChecked || 0;
                    const [noticesCount, messagesCount, matchingCount] = await Promise.all([
                        FirebaseUtils.getUnreadNoticesCount(user.uid, lastNoticeChecked),
                        FirebaseUtils.getUnreadMessagesCount(user.uid),
                        FirebaseUtils.getPendingMatchRequestsCount(user.uid)
                    ]);
                    setBadgeCounts({ notices: noticesCount, messages: messagesCount, matching: matchingCount });
                } catch (e) {
                    console.log('배지 카운트 로드 실패:', e);
                }
            };

            const loadWeather = async () => {
                try {
                    // 평택고덕 좌표 (대략)
                    const lat = 37.0847;
                    const lon = 127.0365;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=Asia/Seoul`);
                    const data = await res.json();
                    setWeather({
                        temp: Math.round(data.current.temperature_2m),
                        code: data.current.weather_code
                    });
                } catch (e) {
                    console.log('날씨 로드 실패');
                }
            };

            const loadPopularPosts = async () => {
                try {
                    const posts = await FirebaseUtils.getPopularPosts(3);
                    setPopularPosts(posts);
                } catch (e) {
                    console.log('인기글 로드 실패');
                } finally {
                    setLoadingPopular(false);
                }
            };

            const getWeatherIcon = (code) => {
                if (code === 0) return '☀️';
                if (code <= 3) return '⛅';
                if (code <= 49) return '🌫️';
                if (code <= 69) return '🌧️';
                if (code <= 79) return '❄️';
                if (code <= 99) return '⛈️';
                return '🌤️';
            };

            const menuItems = [
                { id: 'chatrooms', icon: MessageCircle, name: '모임방', bgColor: 'bg-blue-100', iconColor: 'text-blue-600' },
                { id: 'events', icon: Calendar, name: '이벤트', bgColor: 'bg-blue-100', iconColor: 'text-blue-600' },
                { id: 'matching', icon: Heart, name: '매칭', bgColor: 'bg-pink-100', iconColor: 'text-pink-600' },
                { id: 'directMessages', icon: Mail, name: '메시지', bgColor: 'bg-blue-100', iconColor: 'text-blue-600' },
                { id: 'notices', icon: AlertCircle, name: '공지', bgColor: 'bg-amber-100', iconColor: 'text-amber-600' },
                { id: 'calendar', icon: Calendar, name: '캘린더', bgColor: 'bg-teal-100', iconColor: 'text-teal-600' },
                { id: 'bookmarks', icon: Bookmark, name: '즐겨찾기', bgColor: 'bg-amber-100', iconColor: 'text-amber-600' },
                { id: 'statistics', icon: BarChart, name: '통계', bgColor: 'bg-purple-100', iconColor: 'text-purple-600' },
            ];

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {/* 컴팩트 헤더 */}
                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="px-4 py-3 flex items-center justify-between max-w-lg mx-auto">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-slate-700 rounded-lg flex items-center justify-center">
                                    <Home size={16} className="text-white" />
                                </div>
                                <span className="font-semibold text-gray-800">평택고덕행복주택</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setCurrentPage('search')}
                                    className="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-colors"
                                >
                                    <Search size={18} className="text-gray-600" />
                                </button>
                                <button
                                    onClick={() => setShowProfileModal(true)}
                                    className="w-9 h-9 bg-slate-600 rounded-full flex items-center justify-center text-white text-sm font-medium"
                                >
                                    {userProfile?.nickname?.[0] || '?'}
                                </button>
                            </div>
                        </div>
                    </header>

                    <div className="px-4 py-4 max-w-lg mx-auto">
                        {/* 날씨 위젯 */}
                        {weather && (
                            <div className="bg-gradient-to-r from-sky-400 to-blue-500 rounded-xl p-4 mb-4 text-white">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <p className="text-sm opacity-90">평택고덕</p>
                                        <p className="text-3xl font-bold">{weather.temp}°C</p>
                                    </div>
                                    <span className="text-4xl">{getWeatherIcon(weather.code)}</span>
                                </div>
                            </div>
                        )}

                        {/* 컴팩트 4열 그리드 */}
                        <div className="grid grid-cols-4 gap-2">
                            {menuItems.map(item => {
                                const Icon = item.icon;
                                const badgeCount = badgeCounts[item.id] || 0;
                                return (
                                    <button
                                        key={item.id}
                                        onClick={() => setCurrentPage(item.id)}
                                        className="flex flex-col items-center p-3 rounded-xl hover:bg-gray-100 active:bg-gray-200 transition-colors"
                                    >
                                        <div className={`relative w-12 h-12 ${item.bgColor} rounded-xl flex items-center justify-center mb-1.5`}>
                                            <Icon size={22} className={item.iconColor} />
                                            {badgeCount > 0 && (
                                                <span className="absolute -top-1 -right-1 min-w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center px-1">
                                                    {badgeCount > 99 ? '99+' : badgeCount}
                                                </span>
                                            )}
                                        </div>
                                        <span className="text-xs text-gray-700 font-medium">{item.name}</span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* 인기글 섹션 */}
                        <div className="mt-6">
                            <div className="flex items-center justify-between mb-3 px-1">
                                <h3 className="text-sm font-semibold text-gray-500 flex items-center gap-1">
                                    <TrendingUp size={14} /> 인기글
                                </h3>
                            </div>
                            <div className="bg-white rounded-xl border border-gray-100 divide-y divide-gray-100">
                                {loadingPopular ? (
                                    <div className="p-4 text-center text-gray-400 text-sm">로딩 중...</div>
                                ) : popularPosts.length === 0 ? (
                                    <div className="p-4 text-center text-gray-400 text-sm">아직 게시물이 없습니다</div>
                                ) : (
                                    popularPosts.map((post, idx) => (
                                        <button
                                            key={post.id}
                                            onClick={() => setCurrentPage(post.type)}
                                            className="w-full p-3 text-left hover:bg-gray-50 transition-colors flex items-center gap-3"
                                        >
                                            <span className="text-lg font-bold text-gray-300">{idx + 1}</span>
                                            <div className="flex-1 min-w-0">
                                                <p className="text-sm font-medium text-gray-800 truncate">{post.title}</p>
                                                <p className="text-xs text-gray-400">{post.typeName} · ❤️ {post.likes?.length || 0}</p>
                                            </div>
                                        </button>
                                    ))
                                )}
                            </div>
                        </div>

                        {/* 게시판 바로가기 */}
                        <div className="mt-6">
                            <h3 className="text-sm font-semibold text-gray-500 mb-3 px-1">게시판</h3>
                            <div className="space-y-2">
                                <button onClick={() => setCurrentPage('posts')} className="w-full flex items-center justify-between p-3 bg-white rounded-xl border border-gray-100 hover:border-emerald-300 hover:bg-emerald-50 transition-all">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-emerald-100 rounded-lg flex items-center justify-center"><FileText size={18} className="text-emerald-600" /></div>
                                        <span className="font-medium text-gray-800">모임 후기</span>
                                    </div>
                                    <ChevronRight size={18} className="text-gray-400" />
                                </button>
                                <button onClick={() => setCurrentPage('recommendations')} className="w-full flex items-center justify-between p-3 bg-white rounded-xl border border-gray-100 hover:border-orange-300 hover:bg-orange-50 transition-all">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-orange-100 rounded-lg flex items-center justify-center"><MapPin size={18} className="text-orange-600" /></div>
                                        <span className="font-medium text-gray-800">맛집 추천</span>
                                    </div>
                                    <ChevronRight size={18} className="text-gray-400" />
                                </button>
                                <button onClick={() => setCurrentPage('trading')} className="w-full flex items-center justify-between p-3 bg-white rounded-xl border border-gray-100 hover:border-pink-300 hover:bg-pink-50 transition-all">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-pink-100 rounded-lg flex items-center justify-center"><DollarSign size={18} className="text-pink-600" /></div>
                                        <span className="font-medium text-gray-800">나눔 · 중고거래</span>
                                    </div>
                                    <ChevronRight size={18} className="text-gray-400" />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 프로필 모달 */}
                    {showProfileModal && (
                        <ProfileModal
                            userProfile={userProfile}
                            onClose={() => setShowProfileModal(false)}
                            onEditProfile={() => {
                                setShowProfileModal(false);
                                setCurrentPage('settings');
                            }}
                        />
                    )}
                </div>
            );
        };

        // 이벤트 페이지 (참가 취소 기능 및 참가자 목록 표시 추가)
        const EventsPage = ({ user, userProfile, setCurrentPage }) => {
            const [events, setEvents] = useState([]);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            const [selectedEvent, setSelectedEvent] = useState(null);
            const [loading, setLoading] = useState(true);
            const [bookmarkedEvents, setBookmarkedEvents] = useState(new Set());
            const [searchQuery, setSearchQuery] = useState('');
            const [filterInterest, setFilterInterest] = useState('all');
            const [filterStatus, setFilterStatus] = useState('all'); // all, open, full
            const [error, setError] = useState(null);
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, type: null, data: null });

            useEffect(() => {
                loadEvents();
                loadBookmarks();
            }, []);

            const loadEvents = async () => {
                setLoading(true);
                setError(null);
                try {
                    const evts = await FirebaseUtils.getEvents();
                    setEvents(evts);
                } catch (err) {
                    console.error('이벤트 로드 실패:', err);
                    setError(getErrorMessage(err));
                } finally {
                    setLoading(false);
                }
            };

            const loadBookmarks = async () => {
                try {
                    const bookmarks = await FirebaseUtils.getUserBookmarks(user.uid);
                    const eventBookmarkIds = bookmarks
                        .filter(b => b.itemType === 'event')
                        .map(b => b.itemId);
                    setBookmarkedEvents(new Set(eventBookmarkIds));
                } catch (err) {
                    console.error('북마크 로드 실패:', err);
                }
            };

            const handleToggleBookmark = async (eventId) => {
                try {
                    if (bookmarkedEvents.has(eventId)) {
                        await FirebaseUtils.removeBookmark(user.uid, 'event', eventId);
                        setBookmarkedEvents(prev => {
                            const newSet = new Set(prev);
                            newSet.delete(eventId);
                            return newSet;
                        });
                        setToast({ message: '북마크가 해제되었습니다.', type: 'info' });
                    } else {
                        await FirebaseUtils.addBookmark(user.uid, 'event', eventId);
                        setBookmarkedEvents(prev => new Set([...prev, eventId]));
                        setToast({ message: '북마크에 추가되었습니다.', type: 'success' });
                    }
                } catch (err) {
                    setToast({ message: getErrorMessage(err), type: 'error' });
                }
            };

            const handleJoinEvent = async (event) => {
                try {
                    await FirebaseUtils.joinEvent(event.id, user.uid, userProfile?.nickname);
                    setToast({ message: '이벤트 참가 신청이 완료되었습니다!', type: 'success' });
                    loadEvents();
                } catch (err) {
                    setToast({ message: getErrorMessage(err), type: 'error' });
                }
            };

            const handleLeaveEvent = (event) => {
                setConfirmModal({ isOpen: true, type: 'leave', data: event });
            };

            const confirmLeaveEvent = async () => {
                const event = confirmModal.data;
                setConfirmModal({ isOpen: false, type: null, data: null });

                try {
                    await FirebaseUtils.leaveEvent(event.id, user.uid);
                    setToast({ message: '이벤트 참가가 취소되었습니다.', type: 'success' });
                    loadEvents();
                } catch (err) {
                    setToast({ message: getErrorMessage(err), type: 'error' });
                }
            };

            const handleGoToChat = (event) => {
                if (event.chatRoomId) {
                    setSelectedEvent(event);
                }
            };

            const handleDeleteEvent = (eventId) => {
                setConfirmModal({ isOpen: true, type: 'delete', data: eventId });
            };

            const confirmDeleteEvent = async () => {
                const eventId = confirmModal.data;
                setConfirmModal({ isOpen: false, type: null, data: null });

                try {
                    await FirebaseUtils.deleteEvent(eventId);
                    setToast({ message: '이벤트가 삭제되었습니다.', type: 'success' });
                    loadEvents();
                } catch (err) {
                    setToast({ message: getErrorMessage(err), type: 'error' });
                }
            };

            const handleEditEvent = (event) => {
                setEditingEvent(event);
                setShowEditModal(true);
            };

            // 이벤트 채팅방으로 이동
            if (selectedEvent) {
                return <EventChatRoom event={selectedEvent} user={user} userProfile={userProfile} onBack={() => {
                    setSelectedEvent(null);
                    loadEvents();
                }} />;
            }

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {/* Toast 알림 */}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {/* 확인 모달 */}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title={confirmModal.type === 'delete' ? '이벤트 삭제' : '참가 취소'}
                        message={confirmModal.type === 'delete'
                            ? '이벤트를 삭제하시겠습니까? 연결된 채팅방도 함께 삭제됩니다.'
                            : '이벤트 참가를 취소하시겠습니까?'}
                        onConfirm={confirmModal.type === 'delete' ? confirmDeleteEvent : confirmLeaveEvent}
                        onCancel={() => setConfirmModal({ isOpen: false, type: null, data: null })}
                        confirmText={confirmModal.type === 'delete' ? '삭제' : '취소하기'}
                        danger={confirmModal.type === 'delete'}
                    />

                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-bold text-gray-800">모임 이벤트</h1>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setShowCreateModal(true)} className="bg-slate-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-slate-800 text-sm">
                                        <Plus size={16} /> 새 이벤트
                                    </button>
                                    <button onClick={() => setCurrentPage('dashboard')} className="text-gray-500 hover:text-gray-700 text-sm">← 돌아가기</button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-8">
                        <div className="max-w-4xl mx-auto space-y-4">
                            {/* 에러 표시 */}
                            {error && <ErrorDisplay error={error} onRetry={loadEvents} />}

                            {/* 검색 및 필터 */}
                            <div className="bg-white rounded-xl shadow-sm p-4">
                                <div className="flex flex-col md:flex-row gap-3">
                                    <div className="flex-1 relative">
                                        <Search size={20} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" />
                                        <input
                                            type="text"
                                            placeholder="이벤트 검색..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 focus:border-slate-400"
                                        />
                                    </div>
                                    <select
                                        value={filterInterest}
                                        onChange={(e) => setFilterInterest(e.target.value)}
                                        className="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 focus:border-slate-400 text-sm"
                                    >
                                        <option value="all">전체 관심사</option>
                                        {interests.map(interest => (
                                            <option key={interest.id} value={interest.id}>{interest.name}</option>
                                        ))}
                                    </select>
                                    <select
                                        value={filterStatus}
                                        onChange={(e) => setFilterStatus(e.target.value)}
                                        className="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 focus:border-slate-400 text-sm"
                                    >
                                        <option value="all">전체 상태</option>
                                        <option value="open">참가 가능</option>
                                        <option value="full">마감</option>
                                    </select>
                                </div>
                            </div>

                            {loading ? (
                                <div className="text-center py-12">
                                    <div className="loading"></div>
                                    <p className="mt-4 text-gray-600">로딩 중...</p>
                                </div>
                            ) : (() => {
                                const filteredEvents = events.filter(event => {
                                    const matchesSearch = event.title?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                                        event.description?.toLowerCase().includes(searchQuery.toLowerCase());
                                    const matchesInterest = filterInterest === 'all' || event.interestId === filterInterest;
                                    const isFull = event.maxParticipants && event.participants?.length >= event.maxParticipants;
                                    const matchesStatus = filterStatus === 'all' ||
                                                        (filterStatus === 'open' && !isFull) ||
                                                        (filterStatus === 'full' && isFull);
                                    return matchesSearch && matchesInterest && matchesStatus;
                                });

                                return filteredEvents.length === 0 ? (
                                    <div className="bg-white rounded-xl p-12 text-center">
                                        <Calendar size={48} className="mx-auto mb-4 text-gray-400" />
                                        <h3 className="text-xl font-bold text-gray-800 mb-2">
                                            {events.length === 0 ? '아직 이벤트가 없습니다' : '검색 결과가 없습니다'}
                                        </h3>
                                        <p className="text-gray-600 mb-4">
                                            {events.length === 0 ? '첫 번째 이벤트를 만들어보세요!' : '다른 검색어나 필터를 시도해보세요.'}
                                        </p>
                                        {events.length === 0 && (
                                            <button onClick={() => setShowCreateModal(true)} className="bg-slate-700 text-white px-6 py-2 rounded-lg hover:bg-slate-800 text-sm">
                                                이벤트 만들기
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    <div className="grid gap-4">
                                        {filteredEvents.map(event => {
                                        const interest = interests.find(i => i.id === event.interestId);
                                        const isParticipant = event.participants?.some(p => p.userId === user.uid);
                                        const isFull = event.maxParticipants && event.participants?.length >= event.maxParticipants;
                                        
                                        return (
                                            <div key={event.id} className="bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">
                                                <div className="flex items-start justify-between mb-4">
                                                    <div
                                                        className="flex-1 cursor-pointer"
                                                        onClick={() => {
                                                            if (isParticipant || event.creatorId === user.uid) {
                                                                handleGoToChat(event);
                                                            }
                                                        }}
                                                    >
                                                        <div className="flex items-center gap-3 mb-2">
                                                            {interest && <span className={`px-3 py-1 rounded-full text-xs font-medium ${interest.color}`}>{interest.name}</span>}
                                                            <span className="text-sm text-gray-500">
                                                                {event.participants?.length || 0}/{event.maxParticipants || '∞'}명
                                                            </span>
                                                            {(isParticipant || event.creatorId === user.uid) && (
                                                                <span className="text-xs text-green-600 flex items-center gap-1">
                                                                    <MessageCircle size={14} /> 클릭하여 채팅방 입장
                                                                </span>
                                                            )}
                                                        </div>
                                                        <h3 className="text-lg font-bold text-gray-800 mb-2 hover:text-purple-600">{event.title}</h3>
                                                        <p className="text-gray-600 text-sm mb-2">{event.description}</p>
                                                        <div className="flex flex-col gap-1 text-sm text-gray-500">
                                                            <span>📅 {event.eventDate ? new Date(event.eventDate).toLocaleString('ko-KR') : '날짜 미정'}</span>
                                                            <span>📍 {event.location}</span>
                                                            <span>👤 생성자: {event.creatorNickname}</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex flex-col gap-2">
                                                        {/* 북마크 버튼 - 모든 사용자에게 표시 */}
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleToggleBookmark(event.id);
                                                            }}
                                                            className={`px-4 py-2 rounded-lg font-medium flex items-center gap-2 ${
                                                                bookmarkedEvents.has(event.id)
                                                                    ? 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'
                                                                    : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                                            }`}
                                                        >
                                                            <Bookmark size={16} fill={bookmarkedEvents.has(event.id) ? 'currentColor' : 'none'} />
                                                            {bookmarkedEvents.has(event.id) ? '저장됨' : '저장'}
                                                        </button>

                                                        {event.creatorId === user.uid ? (
                                                            <>
                                                                <button
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        handleGoToChat(event);
                                                                    }}
                                                                    className="px-4 py-2 bg-green-100 text-green-700 rounded-lg font-medium hover:bg-green-200 flex items-center gap-2"
                                                                >
                                                                    <MessageCircle size={16} /> 채팅방
                                                                </button>
                                                                <button
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        handleEditEvent(event);
                                                                    }}
                                                                    className="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg font-medium hover:bg-blue-200 flex items-center gap-2"
                                                                >
                                                                    <Edit size={16} /> 수정
                                                                </button>
                                                                <button
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        handleDeleteEvent(event.id);
                                                                    }}
                                                                    className="px-4 py-2 bg-red-100 text-red-700 rounded-lg font-medium hover:bg-red-200 flex items-center gap-2"
                                                                >
                                                                    <Trash size={16} /> 삭제
                                                                </button>
                                                            </>
                                                        ) : isParticipant ? (
                                                            <>
                                                                <button
                                                                    onClick={() => handleGoToChat(event)}
                                                                    className="px-4 py-2 bg-green-100 text-green-700 rounded-lg font-medium hover:bg-green-200 flex items-center gap-2"
                                                                >
                                                                    <MessageCircle size={18} /> 채팅방
                                                                </button>
                                                                <button
                                                                    onClick={() => handleLeaveEvent(event)}
                                                                    className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200"
                                                                >
                                                                    참가 취소
                                                                </button>
                                                            </>
                                                        ) : (
                                                            <button
                                                                onClick={() => handleJoinEvent(event)}
                                                                disabled={isFull}
                                                                className={`px-4 py-2 rounded-lg text-sm ${
                                                                    isFull ? 'bg-gray-100 text-gray-400 cursor-not-allowed' :
                                                                    'bg-slate-700 text-white hover:bg-slate-800'
                                                                }`}
                                                            >
                                                                {isFull ? '마감' : '참가하기'}
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>

                                                {/* 참가자 목록 표시 */}
                                                {event.participants && event.participants.length > 0 && (
                                                    <div className="mt-4 pt-4 border-t">
                                                        <p className="text-sm font-semibold text-gray-700 mb-2">참가자 ({event.participants.length}명)</p>
                                                        <div className="flex flex-wrap gap-2">
                                                            {event.participants.map((participant, idx) => (
                                                                <span key={idx} className="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-medium flex items-center gap-1">
                                                                    {participant.nickname}
                                                                    {participant.userId === event.creatorId && <span className="text-purple-500">👑</span>}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                                );
                            })()}
                        </div>
                    </div>

                    {showCreateModal && <CreateEventModal user={user} userProfile={userProfile} onClose={() => setShowCreateModal(false)} onCreated={() => {
                        setShowCreateModal(false);
                        loadEvents();
                    }} />}

                    {showEditModal && editingEvent && <EditEventModal event={editingEvent} user={user} userProfile={userProfile} onClose={() => {
                        setShowEditModal(false);
                        setEditingEvent(null);
                    }} onUpdated={() => {
                        setShowEditModal(false);
                        setEditingEvent(null);
                        loadEvents();
                    }} />}
                </div>
            );
        };

        // 이벤트 채팅방 컴포넌트 (새로 추가)
        const EventChatRoom = ({ event, user, userProfile, onBack }) => {
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                if (!event.chatRoomId) return;

                loadMessages();
                
                const { firestore, db } = getFirebase();
                
                const unsubscribe = firestore.onSnapshot(
                    firestore.query(
                        firestore.collection(db, `chatRooms/${event.chatRoomId}/messages`),
                        firestore.orderBy('timestamp', 'asc'),
                        firestore.limit(50)
                    ),
                    (snapshot) => {
                        const msgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setMessages(msgs);
                        scrollToBottom();
                    }
                );

                return () => unsubscribe();
            }, [event.chatRoomId]);

            const loadMessages = async () => {
                const msgs = await FirebaseUtils.getMessages(event.chatRoomId);
                setMessages(msgs);
                scrollToBottom();
            };

            const scrollToBottom = () => {
                setTimeout(() => {
                    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
                }, 100);
            };

            const handleSendMessage = async () => {
                if (!newMessage.trim()) return;

                setLoading(true);
                try {
                    await FirebaseUtils.sendMessage(event.chatRoomId, user.uid, userProfile?.nickname, newMessage.trim());
                    setNewMessage('');
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                } finally {
                    setLoading(false);
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h1 className="text-xl font-bold text-gray-800">{event.title} 채팅방</h1>
                                    <p className="text-sm text-gray-500">{event.participants?.length || 0}명 참여중</p>
                                </div>
                                <button onClick={onBack} className="text-gray-600 hover:text-gray-800">← 이벤트 목록</button>
                            </div>
                        </div>
                    </header>

                    <div className="flex-1 container mx-auto px-4 py-4 max-w-4xl">
                        <div className="bg-white rounded-xl shadow-sm h-full flex flex-col">
                            <div className="chat-container flex-1 p-4 space-y-4">
                                {messages.map((msg) => {
                                    const isMyMessage = msg.userId === user.uid;
                                    
                                    return (
                                        <div key={msg.id} className={`flex ${isMyMessage ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`message-bubble ${isMyMessage ? 'bg-slate-700 text-white' : 'bg-gray-100 text-gray-800'} rounded-lg px-4 py-2`}>
                                                {!isMyMessage && <p className="text-xs font-medium mb-1 text-gray-500">{msg.nickname}</p>}
                                                <p className="text-sm">{msg.text}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                                <div ref={messagesEndRef} />
                            </div>

                            <div className="p-4 border-t">
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={newMessage}
                                        onChange={(e) => setNewMessage(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && handleKeyPress(e)}
                                        className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 focus:border-slate-400"
                                        placeholder="메시지를 입력하세요..."
                                        disabled={loading}
                                    />
                                    <button
                                        onClick={handleSendMessage}
                                        disabled={loading || !newMessage.trim()}
                                        className="bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        <Send size={18} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 나머지 컴포넌트들은 이전과 동일 (ChatRoomsPage, CreateEventModal, MatchingPage, SettingsPage 등)
        // 공간 절약을 위해 여기서는 생략하지만, 실제 파일에는 모두 포함되어야 합니다

        // 여기에 나머지 컴포넌트들을 추가 (이전 버전과 동일)
        // ChatRoomsPage, CreateChatRoomModal, ChatRoomDetail, CreateEventModal, MatchingPage, SettingsPage

        // 채팅방 페이지
        const ChatRoomsPage = ({ user, userProfile, setCurrentPage }) => {
            const [chatRooms, setChatRooms] = useState([]);
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [editingRoom, setEditingRoom] = useState(null);
            const [selectedRoom, setSelectedRoom] = useState(null);
            const [loading, setLoading] = useState(true);
            const [bookmarkedRooms, setBookmarkedRooms] = useState(new Set());
            const [searchQuery, setSearchQuery] = useState('');
            const [filterInterest, setFilterInterest] = useState('all');
            const [filterDong, setFilterDong] = useState('all');
            // 에러 처리 및 확인 모달 상태
            const [error, setError] = useState(null);
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, roomId: null });

            useEffect(() => {
                loadChatRooms();
                loadBookmarks();
            }, []);

            const loadChatRooms = async () => {
                setLoading(true);
                setError(null);
                try {
                    const rooms = await FirebaseUtils.getChatRooms();
                    // 이벤트 채팅방 제외
                    const regularRooms = rooms.filter(room => !room.isEventChat);
                    setChatRooms(regularRooms);
                } catch (err) {
                    console.error('모임방 로드 실패:', err);
                    setError(getErrorMessage(err));
                } finally {
                    setLoading(false);
                }
            };

            const loadBookmarks = async () => {
                try {
                    const bookmarks = await FirebaseUtils.getUserBookmarks(user.uid);
                    const roomBookmarkIds = bookmarks
                        .filter(b => b.itemType === 'chatroom')
                        .map(b => b.itemId);
                    setBookmarkedRooms(new Set(roomBookmarkIds));
                } catch (error) {
                    console.error('북마크 로드 실패:', error);
                }
            };

            const handleToggleBookmark = async (roomId) => {
                try {
                    if (bookmarkedRooms.has(roomId)) {
                        await FirebaseUtils.removeBookmark(user.uid, 'chatroom', roomId);
                        setBookmarkedRooms(prev => {
                            const newSet = new Set(prev);
                            newSet.delete(roomId);
                            return newSet;
                        });
                        setToast({ message: '북마크가 해제되었습니다.', type: 'info' });
                    } else {
                        await FirebaseUtils.addBookmark(user.uid, 'chatroom', roomId);
                        setBookmarkedRooms(prev => new Set([...prev, roomId]));
                        setToast({ message: '북마크에 추가되었습니다.', type: 'success' });
                    }
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleJoinRoom = async (room) => {
                try {
                    await FirebaseUtils.joinChatRoom(room.id, user.uid, userProfile?.nickname);
                    setSelectedRoom(room);
                } catch (error) {
                    setToast({ message: getErrorMessage(error), type: 'error' });
                }
            };

            const handleDeleteRoom = (roomId) => {
                setConfirmModal({ isOpen: true, roomId });
            };

            const confirmDeleteRoom = async () => {
                const roomId = confirmModal.roomId;
                setConfirmModal({ isOpen: false, roomId: null });

                try {
                    await FirebaseUtils.deleteChatRoom(roomId);
                    setToast({ message: '모임방이 삭제되었습니다.', type: 'success' });
                    loadChatRooms();
                } catch (err) {
                    setToast({ message: getErrorMessage(err), type: 'error' });
                }
            };

            const handleEditRoom = (room) => {
                setEditingRoom(room);
                setShowEditModal(true);
            };

            if (selectedRoom) {
                return <ChatRoomDetail room={selectedRoom} user={user} userProfile={userProfile} onBack={() => {
                    setSelectedRoom(null);
                    loadChatRooms();
                }} />;
            }

            return (
                <div className="min-h-screen bg-gray-50 pb-16">
                    {/* 토스트 알림 */}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {/* 삭제 확인 모달 */}
                    <ConfirmModal
                        isOpen={confirmModal.isOpen}
                        title="모임방 삭제"
                        message="정말 이 모임방을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다."
                        onConfirm={confirmDeleteRoom}
                        onCancel={() => setConfirmModal({ isOpen: false, roomId: null })}
                        confirmText="삭제"
                        danger={true}
                    />

                    <header className="bg-white shadow-sm">
                        <div className="container mx-auto px-4 py-4">
                            <div className="flex items-center justify-between">
                                <h1 className="text-xl font-bold text-gray-800">관심사 모임방</h1>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setShowCreateModal(true)} className="bg-slate-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-slate-800 text-sm">
                                        <Plus size={16} /> 새 모임방
                                    </button>
                                    <button onClick={() => setCurrentPage('dashboard')} className="text-gray-500 hover:text-gray-700 text-sm">← 돌아가기</button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="container mx-auto px-4 py-8">
                        <div className="max-w-4xl mx-auto space-y-4">
                            {/* 에러 표시 */}
                            <ErrorDisplay error={error} onRetry={loadChatRooms} />

                            {/* 검색 및 필터 */}
                            <div className="bg-white rounded-xl shadow-sm p-4">
                                <div className="flex flex-col md:flex-row gap-3">
                                    <div className="flex-1 relative">
                                        <Search size={20} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" />
                                        <input
                                            type="text"
                                            placeholder="모임방 검색..."
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 focus:border-slate-400"
                                        />
                                    </div>
                                    <select
                                        value={filterInterest}
                                        onChange={(e) => setFilterInterest(e.target.value)}
                                        className="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 focus:border-slate-400 text-sm"
                                    >
                                        <option value="all">전체 관심사</option>
                                        {interests.map(interest => (
                                            <option key={interest.id} value={interest.id}>{interest.name}</option>
                                        ))}
                                    </select>
                                    <select
                                        value={filterDong}
                                        onChange={(e) => setFilterDong(e.target.value)}
                                        className="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-slate-400 focus:border-slate-400 text-sm"
                                    >
                                        <option value="all">전체 동</option>
                                        <option value="all">전체 동 (공개)</option>
                                        <option value="6201">6201동</option>
                                        <option value="6202">6202동</option>
                                        <option value="6203">6203동</option>
                                        <option value="6204">6204동</option>
                                    </select>
                                </div>
                            </div>

                            {loading ? (
                                <div className="text-center py-12">
                                    <div className="loading"></div>
                                    <p className="mt-4 text-gray-600">로딩 중...</p>
                                </div>
                            ) : (() => {
                                const filteredRooms = chatRooms.filter(room => {
                                    const matchesSearch = room.name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                                        room.description?.toLowerCase().includes(searchQuery.toLowerCase());
                                    const matchesInterest = filterInterest === 'all' || room.interestId === filterInterest;
                                    const matchesDong = filterDong === 'all' || room.dong === filterDong || room.dong === 'all';
                                    return matchesSearch && matchesInterest && matchesDong;
                                });

                                return filteredRooms.length === 0 ? (
                                    <div className="bg-white rounded-xl p-12 text-center">
                                        <MessageCircle size={48} className="mx-auto mb-4 text-gray-400" />
                                        <h3 className="text-xl font-bold text-gray-800 mb-2">
                                            {chatRooms.length === 0 ? '아직 모임방이 없습니다' : '검색 결과가 없습니다'}
                                        </h3>
                                        <p className="text-gray-600 mb-4">
                                            {chatRooms.length === 0 ? '첫 번째 모임방을 만들어보세요!' : '다른 검색어나 필터를 시도해보세요.'}
                                        </p>
                                        {chatRooms.length === 0 && (
                                            <button onClick={() => setShowCreateModal(true)} className="bg-slate-700 text-white px-6 py-2 rounded-lg hover:bg-slate-800 text-sm">
                                                모임방 만들기
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    <div className="grid gap-4">
                                        {filteredRooms.map(room => {
                                        const interest = interests.find(i => i.id === room.interestId);
                                        const isMember = room.members?.some(m => m.userId === user.uid);
                                        
                                        return (
                                            <div key={room.id} className="bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">
                                                <div className="flex items-start justify-between">
                                                    <div
                                                        className="flex-1 cursor-pointer"
                                                        onClick={() => {
                                                            if (isMember || room.creatorId === user.uid) {
                                                                handleJoinRoom(room);
                                                            }
                                                        }}
                                                    >
                                                        <div className="flex items-center gap-3 mb-2">
                                                            {interest && <span className={`px-3 py-1 rounded-full text-xs font-medium ${interest.color}`}>{interest.name}</span>}
                                                            <span className="text-sm text-gray-500">{room.members?.length || 0}명 참여중</span>
                                                            {(isMember || room.creatorId === user.uid) && (
                                                                <span className="text-xs text-green-600 flex items-center gap-1">
                                                                    <MessageCircle size={14} /> 클릭하여 채팅방 입장
                                                                </span>
                                                            )}
                                                        </div>
                                                        <h3 className="text-lg font-bold text-gray-800 mb-2 hover:text-indigo-600">{room.name}</h3>
                                                        <p className="text-gray-600 text-sm mb-3">{room.description}</p>
                                                        <div className="flex items-center gap-2 text-xs text-gray-500">
                                                            <span>생성자: {room.creatorNickname}</span>
                                                            {room.dong !== 'all' && <span>· {room.dong}동</span>}
                                                        </div>
                                                    </div>
                                                    <div className="flex flex-col gap-2">
                                                        {/* 북마크 버튼 - 모든 사용자에게 표시 */}
                                                        <button
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                handleToggleBookmark(room.id);
                                                            }}
                                                            className={`px-4 py-2 rounded-lg font-medium flex items-center gap-2 ${
                                                                bookmarkedRooms.has(room.id)
                                                                    ? 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'
                                                                    : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                                            }`}
                                                        >
                                                            <Bookmark size={16} fill={bookmarkedRooms.has(room.id) ? 'currentColor' : 'none'} />
                                                            {bookmarkedRooms.has(room.id) ? '저장됨' : '저장'}
                                                        </button>

                                                        {room.creatorId === user.uid ? (
                                                            <>
                                                                <button
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        handleJoinRoom(room);
                                                                    }}
                                                                    className="px-4 py-2 bg-green-100 text-green-700 rounded-lg font-medium hover:bg-green-200 flex items-center gap-2"
                                                                >
                                                                    <MessageCircle size={16} /> 채팅방
