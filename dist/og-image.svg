<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 장식 원들 -->
  <circle cx="100" cy="100" r="200" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#8b5cf6" opacity="0.1"/>

  <!-- 아이콘 (집 모양) -->
  <g transform="translate(540, 150)">
    <rect x="20" y="60" width="80" height="70" rx="8" fill="url(#accent)"/>
    <polygon points="60,10 10,60 110,60" fill="url(#accent)"/>
    <rect x="45" y="90" width="30" height="40" fill="#1e3a5f"/>
  </g>

  <!-- 메인 텍스트 -->
  <text x="600" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">
    평택고덕행복주택
  </text>

  <!-- 서브 텍스트 -->
  <text x="600" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8">
    이웃과 함께하는 커뮤니티
  </text>

  <!-- 태그들 -->
  <g transform="translate(600, 450)" text-anchor="middle">
    <rect x="-280" y="0" width="120" height="40" rx="20" fill="#3b82f6" opacity="0.3"/>
    <text x="-220" y="27" font-family="Arial, sans-serif" font-size="18" fill="#60a5fa">모임</text>

    <rect x="-130" y="0" width="120" height="40" rx="20" fill="#8b5cf6" opacity="0.3"/>
    <text x="-70" y="27" font-family="Arial, sans-serif" font-size="18" fill="#a78bfa">이벤트</text>

    <rect x="20" y="0" width="120" height="40" rx="20" fill="#ec4899" opacity="0.3"/>
    <text x="80" y="27" font-family="Arial, sans-serif" font-size="18" fill="#f472b6">매칭</text>

    <rect x="170" y="0" width="120" height="40" rx="20" fill="#10b981" opacity="0.3"/>
    <text x="230" y="27" font-family="Arial, sans-serif" font-size="18" fill="#34d399">나눔</text>
  </g>

  <!-- 하단 URL -->
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#64748b">
    happyhousecomm.ideastudio.one
  </text>
</svg>
